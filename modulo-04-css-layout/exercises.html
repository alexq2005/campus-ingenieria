<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicios PS4 — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../index.html">← Portal</a>
      <div class="right">
        <a href="../lectures.html#m4">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set 4 — CSS Layout\n\n## Sección A — Flexbox\n\n1. **Navbar**: construí `navbar.html` con logo a la izquierda, menú (3 links) al centro, y un botón \"Login\" a la derecha. En móvil (<640px): el menú pasa a columna debajo del logo, el botón queda arriba a la derecha.\n\n2. **Cards iguales de alto**: 3 cards en fila, cada una con título, párrafo de distinto largo, y botón al fondo. Todas deben medir lo mismo de alto, y el botón debe quedar alineado al fondo aunque el texto sea distinto.\n\n3. **Centrado perfecto**: un `<div>` de 300×200px centrado exacto vertical y horizontalmente en la pantalla (viewport completo). Lograrlo en 4 líneas de CSS.\n\n## Sección B — Grid\n\n4. **Calendario**: creá una grilla 7×5 (semanas×días) usando Grid. Cada celda es un `<div>` con un número. Nombres de días arriba con `grid-column` manual. Gap de 4px.\n\n5. **Dashboard**: layout con `grid-template-areas`:\n   ```\n   \"nav header header\"\n   \"nav main  aside\"\n   \"nav main  aside\"\n   \"nav footer footer\"\n   ```\n   - `nav` es 200px fijo; `aside` es 240px; el resto es `1fr`.\n   - En móvil (<768px): nav arriba como drawer, main, aside abajo, footer.\n\n6. **Galería masonry-ish** (sin masonry real): 12 imágenes distribuidas en columnas de mínimo 200px con `auto-fit`, `gap: 8px`. Algunas imágenes deben ocupar 2 columnas (usá `grid-column: span 2` selectivamente).\n\n## Sección C — Responsive\n\n7. Abrí tu `cv.html` del PS2. Ahora:\n   - Volvélo responsive con Grid + Flexbox.\n   - Mobile-first: todo columna única abajo de 640px.\n   - Tablet (640–1024px): la foto a la izquierda, nombre/rol a la derecha en el header.\n   - Desktop (>1024px): dos columnas de contenido (experiencia | educación+habilidades).\n\n8. Implementá **dark mode** con `prefers-color-scheme` + un toggle manual que sobrescriba con `data-theme=\"dark\"` en `<html>`.\n\n## Sección D — Patterns\n\n9. Replicá este patrón de [Every Layout](https://every-layout.dev): **Sidebar intrínseca**. Una sidebar de 240px a la izquierda y `main` a la derecha que ocupa todo el resto. Cuando no hay espacio, la sidebar pasa arriba automáticamente (**sin media queries**). Pista: `flex-wrap: wrap` + `flex-basis` + `min-inline-size` en main.\n\n10. **Cluster layout** (tags que envuelven): 15 tags con distinto largo, gap de 6px, wrap automático.\n\n## Sección E — Recreación\n\n11. Elegí **una de estas tres páginas** y recreá su layout principal con HTML semántico + Flex/Grid (sin copiar imágenes ni colores, solo el layout):\n    - Homepage de [Stripe](https://stripe.com)\n    - Homepage de [Apple](https://www.apple.com)\n    - Dashboard de [Vercel](https://vercel.com/dashboard) (solo estructura visible)\n\n## Desafío\n\n12. **Holy Grail en 10 líneas**: escribí el Holy Grail layout (header, sidebar, main, aside, footer) en **exactamente 10 líneas de CSS** o menos (sin contar llaves, selectores o vacías). Cronometralo.\n\n13. **Container query**: construí una `<card>` que se re-layout-ee según su contenedor (no el viewport). Si el contenedor es angosto: título arriba, imagen abajo. Si es ancho: imagen izq, contenido der. Reutilizala en una sidebar y en un main para ver la diferencia.\n\n## Entregable\n\nCarpeta `ps4/` con al menos 6 archivos (`navbar.html`, `cards.html`, `dashboard.html`, `cv-responsive.html`, `sidebar-intrinseca.html`, y uno de los ejercicios E/F). Deploy rápido: subí a [GitHub Pages](https://pages.github.com/) o [Netlify Drop](https://app.netlify.com/drop).\n"</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
