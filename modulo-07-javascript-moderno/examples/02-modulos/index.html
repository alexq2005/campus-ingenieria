<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Módulos ES — carrito</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 2rem auto; padding: 1rem; background: #f8fafc; }
    .grid { display: grid; gap: 0.8rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .prod { background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); display: flex; flex-direction: column; gap: 0.3rem; }
    .prod button { background: #0ea5e9; color: white; border: 0; padding: 0.5rem; border-radius: 5px; cursor: pointer; font-weight: 600; margin-top: auto; }
    .prod button:hover { background: #0284c7; }
    .precio { color: #16a34a; font-weight: bold; }

    #carrito { margin-top: 2rem; background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    #carrito ul { list-style: none; padding: 0; }
    #carrito li { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid #e2e8f0; }
    .total { font-weight: bold; color: #0f172a; font-size: 1.1rem; margin-top: 0.8rem; }
    .nota { background: #fef3c7; color: #78350f; padding: 0.6rem; border-radius: 5px; font-size: 0.85em; margin-top: 1rem; }
  </style>
</head>
<body>

  <h1>Tienda (con módulos ES)</h1>

  <div class="nota">
    Este archivo usa <code>&lt;script type="module"&gt;</code> + <code>import/export</code>.
    Requiere servirse por HTTP (no <code>file://</code>). Si abrís directo del disco, vas a ver
    un error CORS en la consola. Serví con Live Server (VS Code) o <code>npx serve</code>.
  </div>

  <h2>Productos</h2>
  <div class="grid" id="productos"></div>

  <section id="carrito">
    <h2>Carrito</h2>
    <ul id="lista"></ul>
    <div class="total" id="total">Total: $0</div>
  </section>

  <script type="module" src="./app.js"></script>
</body>
</html>
