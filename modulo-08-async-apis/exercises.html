<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicios PS8 — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../index.html">← Portal</a>
      <div class="right">
        <a href="../lectures.html#m8">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set 8 — Asincronía y APIs\n\n## Sección A — Predicción del event loop\n\n1. Predecí la salida sin ejecutar:\n```js\nconsole.log('A');\nsetTimeout(() => console.log('B'), 0);\nPromise.resolve().then(() => console.log('C'));\n(async () => {\n  console.log('D');\n  await null;\n  console.log('E');\n})();\nconsole.log('F');\n```\n\n## Sección B — Promises\n\n2. Escribí una función `delay(ms)` que devuelva una promesa que resuelve después de `ms`.\n\n3. Implementá `timeout(promise, ms)` que rechace si la promesa original tarda más de `ms`. Usá `Promise.race`.\n\n4. Implementá `retry(fn, veces)` que ejecute `fn` (una función async) y reintente hasta `veces` si falla.\n\n5. Con `Promise.allSettled`, armá un reporte `{ exitosos: N, fallidos: N, errores: [...] }` para un array de 10 URLs.\n\n## Sección C — Fetch\n\n6. Consumí `https://jsonplaceholder.typicode.com/users` y mostrá cada usuario como una `<li>` con nombre y email.\n\n7. Construí una **app del clima**: input de ciudad → fetch a `https://api.open-meteo.com/v1/forecast?latitude=-34.6&longitude=-58.4&current=temperature_2m` (o similar) → mostrar temperatura. Manejá errores y \"sin red\".\n\n8. **Buscador de GitHub users**: input que al tipear (con debounce 300ms) consulta `https://api.github.com/users/{nombre}` y muestra avatar + nombre + bio. Con AbortController para cancelar el fetch anterior.\n\n9. **POST con JSON**: usá `https://jsonplaceholder.typicode.com/posts` con `method: 'POST'`. Mostrá la respuesta (incluye un `id` generado).\n\n## Sección D — Patrones reales\n\n10. Implementá una **paginación** que cargue 10 items inicialmente. Botón \"Cargar más\" trae los siguientes 10. Endpoint sugerido: `https://jsonplaceholder.typicode.com/posts?_start=0&_limit=10`.\n\n11. **Infinite scroll** con IntersectionObserver: carga más items cuando el usuario llega al fondo.\n\n12. **Lazy loading de imágenes** con IntersectionObserver: las imágenes solo se descargan cuando están cerca del viewport.\n\n## Sección E — Manejo de estado async\n\n13. Construí una **abstracción `useFetch(url)`** (función que devuelve `{ data, loading, error }`). Cambiá el estado visible según `loading`. (Sin React, con clases o event emitter).\n\n14. Implementá una **caché en memoria** para fetch: si ya pediste la URL X, devolvé la copia cacheada la segunda vez. Con invalidación por tiempo (TTL).\n\n## Sección F — Proyecto mini\n\n15. **Galería de Unsplash / Pexels / Pixabay** (alguna que tenga API pública gratuita):\n    - Input de búsqueda con debounce.\n    - Grid responsive de 3–6 columnas (Grid con `auto-fit`).\n    - Click en imagen → modal con más info.\n    - Infinite scroll o paginación.\n    - Loading skeletons mientras se cargan.\n    - Estado vacío / error prolijos.\n\n## Desafío\n\n16. **Polyfill de fetch** usando `XMLHttpRequest` bajo el capó. Respetá la misma API: `fetch(url, options).then(resp => ...)` con `resp.json()`, `resp.ok`, `resp.status`. Permite entender qué hace fetch por debajo.\n\n17. **Worker thread**: mové un cálculo pesado (ej: factorial de BigInt grande) a un Web Worker (`new Worker('worker.js')`). Medí el freeze de la UI con y sin worker.\n\n## Entregable\n\nRepo en GitHub con 3 apps funcionando (ejercicios 8, 11, 15). Deploy a Netlify/Vercel (gratis).\n"</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
