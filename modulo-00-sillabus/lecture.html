<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bienvenida & Setup — CS-FE</title>
  <meta name="description" content="Bienvenida y Setup: lección del campus CS-FE con teoría, ejemplos y ejercicios.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../index.html">← Portal</a>
      <div class="right">
        <a href="../lectures.html#m0">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Módulo 0 — Bienvenida, setup y metodología\n\n> *\"The computer is the most remarkable tool that we've ever come up with. It's the equivalent of a bicycle for our minds.\"* — Steve Jobs\n\n---\n\n## 0.1 ¿Por qué este curso?\n\nHay dos tipos de desarrolladores frontend:\n\n1. Los que copian y pegan de Stack Overflow sin saber qué hace el código.\n2. Los que entienden la plataforma web — sus capas, sus trade-offs, su historia — y por eso escriben código que **dura**, **performa** y **escala**.\n\nEste curso te prepara para ser del segundo tipo.\n\n## 0.2 ¿Qué es \"frontend\"?\n\n**Frontend** es todo lo que el usuario ve y toca en su navegador o dispositivo. Es la capa de presentación e interacción de un sistema.\n\nTres lenguajes fundamentales — y **nada** te exime de dominarlos:\n\n| Lenguaje | Responsabilidad | Analogía |\n|----------|----------------|----------|\n| **HTML** | Estructura y semántica del contenido | El esqueleto |\n| **CSS** | Presentación visual y layout | La piel y la ropa |\n| **JavaScript** | Comportamiento e interactividad | Los músculos y el sistema nervioso |\n\nFrameworks como React, Vue o Svelte **se compilan** a estos tres. Si no dominás la base, los frameworks se convierten en una caja negra.\n\n## 0.3 Setup del entorno\n\n### 1. Navegador\n\nInstalá **Google Chrome** o **Firefox Developer Edition**. Ambos tienen DevTools excepcionales.\n\n### 2. Editor de código\n\n**VS Code** — gratis, open source, con ecosistema enorme. Descargalo en https://code.visualstudio.com/.\n\nExtensiones recomendadas para empezar:\n- `Live Server` (Ritwick Dey) — sirve HTML con auto-reload.\n- `Prettier - Code formatter` — formateo automático.\n- `ESLint` (lo usaremos desde el módulo 9).\n\n### 3. Terminal\n\n- Windows: usá **Git Bash** o **PowerShell**.\n- macOS / Linux: el terminal del sistema.\n\n### 4. Git + GitHub\n\n- Descargá Git: https://git-scm.com/\n- Creá una cuenta en https://github.com (tu CV técnico).\n\n### 5. Node.js (para el módulo 9 en adelante)\n\n- Descargá la versión **LTS** (20+) desde https://nodejs.org/\n- Verificá: `node --version` y `npm --version` en la terminal.\n\n## 0.4 Cómo abordar cada módulo\n\n```\n┌──────────────────────────────────────────────────┐\n│  1. Leer el lecture completo (30–60 min)         │\n│  2. Correr los ejemplos, modificarlos (30 min)   │\n│  3. Resolver los ejercicios solo (1–2 hs)        │\n│  4. Comparar con la solución (si hay)            │\n│  5. Explicárselo a alguien (o a vos mismo)       │\n└──────────────────────────────────────────────────┘\n```\n\n## 0.5 Mentalidad\n\n- **Leé la documentación.** MDN Web Docs (https://developer.mozilla.org) es la biblia del frontend.\n- **Los errores son amigos.** Cada error es información; leelo, no lo ignores.\n- **Google/Stack Overflow son aliados, no muletas.** Preguntá *después* de pensar 10 minutos, no antes.\n- **Construí.** El único atajo es tipear código.\n\n---\n\n**Siguiente módulo:** [`01 — Cómo funciona la Web`](../modulo-01-como-funciona-web/)\n"</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
