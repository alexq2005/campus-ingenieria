<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S3 · Ejercicios — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../../index.html">← Portal</a>
      <div class="right">
        <a href="../../lectures.html#s3">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set S-03 — Testing Strategy\n\n## Sección A — Análisis crítico\n\n1. Tomá un componente real de tu portfolio (o uno open source) que **no tenga tests**. Listá:\n   - 5 cosas que SÍ deberías testear y por qué.\n   - 3 cosas que probablemente NO valga la pena testear y por qué.\n   - El nivel ideal para cada test (unit / integration / E2E / static).\n\n2. Audit de un test suite existente (puede ser de un proyecto open source). Para 10 tests al azar:\n   - ¿Testea comportamiento o implementación?\n   - ¿Rompería si refactorizás sin cambiar el comportamiento?\n   - ¿Detectaría si la feature realmente se rompe?\n\n## Sección B — Setup\n\n3. En un proyecto Vite + React + TS, configurá:\n   - Vitest + React Testing Library + jsdom\n   - MSW para mock de fetch\n   - Playwright con 3 browsers (chromium, firefox, webkit)\n   - GitHub Actions que corre lint + test + build en cada PR\n\n4. Configurá **coverage** con `@vitest/coverage-v8`. Generá el reporte HTML.\n\n## Sección C — Unit tests\n\n5. Implementá y testeá una función `calcularDescuento(items, codigo)`:\n   - Códigos válidos: `BIENVENIDO10` (10%), `VIP25` (25%), `BLACKFRIDAY50` (50%, solo en noviembre).\n   - `BLACKFRIDAY50` solo aplica si la fecha actual está en noviembre.\n   - Tests deben cubrir: códigos válidos, inválidos, mayúsculas/minúsculas, fecha de BLACKFRIDAY50.\n   - Bonus: usá **fake timers** de Vitest para testear el caso de noviembre.\n\n6. Testeá un reducer complejo (el del carrito del PS S-02 ej. 3). Cubrí:\n   - Cada acción individualmente (10+ tests).\n   - Edge cases: aplicar cupón con carrito vacío, remover item inexistente.\n   - Inmutabilidad: el state previo no debe mutarse.\n\n## Sección D — Integration tests con React Testing Library\n\n7. Componente `<SearchBox onSearch debounceMs />` con debounce. Testeá:\n   - Llama `onSearch` UNA vez después de tipear y esperar el debounce.\n   - NO llama si el usuario sigue tipeando.\n   - Llama con el último valor, no intermedios.\n   - Pista: usá `vi.useFakeTimers()` + `vi.advanceTimersByTime()`.\n\n8. `<UserProfile userId />` que hace fetch a `/api/users/:id`. Con MSW, testeá:\n   - Renderiza loading inicial.\n   - Renderiza datos cuando llega la respuesta.\n   - Renderiza error si HTTP 500.\n   - Renderiza empty state si HTTP 404.\n   - Refetch al cambiar `userId`.\n\n9. Custom hook `useFavorites(userId)`. Test con `renderHook` de RTL:\n   - Devuelve lista inicial vacía.\n   - `add(productId)` agrega y persiste.\n   - `remove(productId)` quita.\n   - `isFavorite(productId)` devuelve boolean correcto.\n\n## Sección E — E2E con Playwright\n\n10. Setup completo con **auth.json** que loguea una vez y reusa la sesión en todos los tests.\n\n11. **Page Object** para `<LoginPage>` y `<DashboardPage>`. Tests:\n    - Login válido lleva al dashboard.\n    - Login inválido muestra error.\n    - Tab key navega entre campos en el orden correcto.\n    - Escape cierra el modal de \"olvidé contraseña\".\n\n12. **Visual regression** con `expect(page).toHaveScreenshot()`. Capturá:\n    - Home en desktop + mobile.\n    - Form de login en estado inicial + con errores.\n    - Card del producto en hover + active.\n\n## Sección F — Mocking estratégico\n\n13. Refactorizá un test que usa `vi.mock('./api')` para usar **MSW** en su lugar. Comentá las diferencias:\n    - ¿Qué tests se vuelven más realistas?\n    - ¿Hay algún caso donde el mock de módulo sigue siendo mejor?\n\n14. **Test factory**:\n    - Implementá `makeUser(overrides)`, `makeProduct(overrides)`, `makeOrder(overrides)`.\n    - Que cada uno tenga IDs únicos auto-incrementales.\n    - Bonus: agregá variantes (`makeAdmin()`, `makeProductOnSale()`) usando spread.\n\n## Sección G — Mutation testing\n\n15. Setup Stryker (`@stryker-mutator/core` + `@stryker-mutator/vitest-runner`). Corré la mutation en tu carpeta `src/utils/`.\n\n16. Identificá los tests más \"débiles\" (mutaciones que sobreviven). Mejoralos hasta llevar el mutation score &gt; 80%.\n\n## Sección H — Property-based testing\n\n17. Con `fast-check`, escribí 3 propiedades para validar:\n    - `JSON.parse(JSON.stringify(x))` es deep-equal a `x` para cualquier objeto serializable.\n    - `arr.reverse().reverse()` siempre es igual al array original (cualquier tipo).\n    - `cart.add(c, item)` siempre incrementa `cart.totalItems` en exactamente la cantidad del item.\n\n## Desafío\n\n18. **Test suite completo de un componente complejo**: tomá un `<DataTable>` con sort, filter, pagination, selección múltiple, y CSV export. Diseñá una test suite con:\n    - Static (TS strict)\n    - 10+ unit tests para utilidades de sort/filter\n    - 15+ integration tests para interacción\n    - 3-5 E2E para flujos críticos\n    - 5+ visual snapshots\n    - Mutation score &gt; 80% en utilidades\n\n    Documentá en un README qué decisiones tomaste y por qué.\n\n19. **CI con coverage gate**: configurá GitHub Actions que **falle** si:\n    - Algún test falla.\n    - Coverage cae &lt; 75% (líneas, ramas).\n    - Mutation score &lt; 70%.\n    - Lighthouse Performance &lt; 90 (Playwright + lighthouse).\n\n    El mejor regalo para tu equipo.\n\n## Entregable\n\nRepo `cs-fe-senior-s03-testing` con:\n- DataTable con su test suite completa (ej. 18).\n- Workflow CI/CD con coverage + mutation gates (ej. 19).\n- README documentando las decisiones de testing.\n\nEsto es lo que un senior arma al empezar un proyecto nuevo.\n"</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
