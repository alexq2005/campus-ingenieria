<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S8 · Ejercicios — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../../index.html">← Portal</a>
      <div class="right">
        <a href="../../lectures.html#s8">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set S-08 — Liderazgo Técnico\n\n> Este PS es **diferente** a los anteriores. No hay código que ejecutar. Son ejercicios de comunicación, decisión, escritura.\n>\n> Estas habilidades NO se aprenden leyendo — se desarrollan **practicando con stakes reales**. Hacé estos ejercicios en tu trabajo o proyecto open source, no en el vacío.\n\n## Sección A — ADRs\n\n1. **Tu primer ADR real**:\n   - Identificá una decisión técnica reciente en tu trabajo o proyecto.\n   - Escribí el ADR retroactivo: contexto, opciones, decisión, consecuencias.\n   - Compartilo con tu equipo. Pedí feedback.\n   - Mejoralo.\n\n2. **Audit de ADRs públicos**: leé al menos 5 ADRs reales:\n   - [Spotify ADRs](https://github.com/spotify/backstage/tree/master/docs/architecture-decisions)\n   - [Open source projects](https://adr.github.io/)\n   - Identificá qué los hace buenos: claridad, brevedad, opciones consideradas.\n\n3. **Template propio**: customizá el template de ADR para tu equipo. Considerá:\n   - ¿Necesitás campo \"Status\"?\n   - ¿\"Stakeholders consultados\" tiene sentido en tu org?\n   - ¿\"Métricas de éxito\" para verificar si la decisión funcionó?\n\n## Sección B — RFCs\n\n4. **Escribí un RFC** para una propuesta real:\n   - Migrar de X a Y.\n   - Adoptar una nueva librería.\n   - Refactor arquitectónico.\n   \n   Compartilo con el equipo. Iterá basado en comments durante 1 semana.\n\n5. **Lee RFCs públicos** de proyectos open source:\n   - [Rust RFCs](https://rust-lang.github.io/rfcs/)\n   - [TC39 proposals](https://github.com/tc39/proposals)\n   - Identificá: cómo manejan disagreement, qué hace que un RFC progrese.\n\n## Sección C — Code review\n\n6. **Self-audit de tus reviews recientes**:\n   - Mirá tus últimos 10 comentarios en code reviews.\n   - ¿Cuántos eran `[blocker]` legítimos?\n   - ¿Cuántos eran nits sin valor?\n   - ¿Cuántos enseñaron algo?\n   - ¿Tono fue respetuoso siempre?\n\n7. **Categorizá tus comentarios** los próximos 2 semanas:\n   - `[blocker]`, `[suggestion]`, `[nit]`, `[question]`, `[praise]`.\n   - Apuntá a tener al menos 1 `[praise]` por PR.\n   - Si tenés más `[nit]` que `[suggestion]`, estás siendo pedante.\n\n8. **PR template**:\n   - Diseñá un template para tu equipo. Debe forzar:\n     - ¿Qué problema resuelve?\n     - Screenshot/video si afecta UI.\n     - Cómo testeaste.\n     - Riesgos de deploy.\n   - Implementalo (`.github/PULL_REQUEST_TEMPLATE.md`).\n\n## Sección D — Mentoring\n\n9. **Identificá un mentee**:\n   - Junior en tu equipo (o open source).\n   - Acordá meet-up semanal de 30 min.\n   - Definí goals: \"en 3 meses, X domina Y skill\".\n\n10. **Pair programming session**:\n    - Sesión de 1h donde el junior tipea, vos guiás con preguntas.\n    - Reglas: no agarrás teclado, no resolvés por él.\n    - Después: feedback constructivo en 5 min.\n\n11. **Documento \"Onboarding al equipo\"**:\n    - Roadmap para nuevo dev: semana 1, 2, 3.\n    - Recursos clave (ADRs importantes, docs internas).\n    - Kit de iniciación: issues `good-first-issue`.\n    - Quién consultar para qué.\n\n## Sección E — Postmortems\n\n12. **Postmortem real**:\n    - Recordá un incident reciente (en trabajo o proyecto).\n    - Escribí el postmortem completo blameless.\n    - Acciones con owner + deadline.\n    - Compartilo (al menos al equipo).\n\n13. **5 whys retroactivo**:\n    - Tomá un bug que arreglaste recientemente.\n    - Apliquá 5 whys hasta llegar al root cause sistémico.\n    - ¿Qué cambio en proceso hubiera prevenido la clase entera de bug?\n\n14. **Análisis de un postmortem público**:\n    - Leé un postmortem famoso (GitHub 2018, AWS S3 2017, Cloudflare 2019).\n    - Identificá:\n      - ¿Qué hicieron bien en el manejo del incident?\n      - ¿Cómo es el tono? ¿Blameless?\n      - ¿Las acciones de prevención son específicas o vagas?\n\n## Sección F — Comunicación\n\n15. **Escribí 3 versiones de la misma propuesta** (audiencia distinta):\n    - Para tu equipo técnico (detalle full).\n    - Para product manager (beneficios + costos en timeline).\n    - Para CEO/CTO (riesgo + impacto sin jerga).\n    \n    Compará lo que cambia en cada versión.\n\n16. **Tech talk interno**:\n    - Tema técnico que dominás.\n    - 30 min, audiencia mixta (técnica + no técnica).\n    - Outline → slides → ensayo → presentación.\n    - Pedí feedback honesto.\n\n17. **Blog post técnico**:\n    - Algo que aprendiste recientemente (~1500 palabras).\n    - Publicar en dev.to, Medium, blog propio.\n    - Goal: explicarlo bien a tu yo de hace 6 meses.\n\n## Sección G — Influencia y decisiones\n\n18. **Decir \"no\" estructurado**:\n    - Próxima vez que alguien te pida algo poco realista, NO digas \"imposible\".\n    - Aplicá el patrón: \"Sí podemos. Costos: A, B, C. Si igual lo priorizan, ¿qué removemos para X?\"\n    - Documentá la conversación: ¿qué funcionó? ¿cómo respondieron?\n\n19. **Identificá tu zona de influencia actual**:\n    - ¿En qué decisiones técnicas te consultan?\n    - ¿En cuáles deberían pero no lo hacen?\n    - ¿Por qué no? (track record, comunicación, posición)\n    - Plan para expandir: 1 cosa concreta a hacer en los próximos 30 días.\n\n## Sección H — Mentalidad\n\n20. **Self-audit \"ownership\"**:\n    - En las últimas 4 semanas, identificá 3 momentos donde dijiste/pensaste \"ese no es mi problema\".\n    - Para cada uno: ¿qué hubieras hecho con mentalidad de ownership total?\n    - ¿Cuál fue la consecuencia real de no tomar ownership?\n\n21. **Carta a tu yo de hace 2 años**:\n    - Escribí ~1 página: ¿qué hiciste mal? ¿Qué desearías haber sabido?\n    - Goal: identificar tus propios anti-patrones.\n\n## Desafío final\n\n22. **Onboarding plan completo** para un dev nuevo a un proyecto tuyo:\n    - Días 1-7: setup + primer PR.\n    - Días 8-30: aprender la arquitectura.\n    - Días 31-60: contribuir features completas.\n    - Días 60-90: liderar área pequeña.\n    - Recursos para cada fase.\n    - Métricas de éxito.\n\n23. **Tech radar de tu equipo**:\n    - Identificá 20+ tecnologías/prácticas en uso o consideradas.\n    - Categorizalas: Adopt, Trial, Assess, Hold (formato ThoughtWorks).\n    - Documentá razón de cada categoría.\n    - Compartí con el equipo, generá discusión.\n\n24. **3-month plan de mejora del equipo**:\n    - Identificá las 3 cosas más dolorosas en tu equipo (con datos).\n    - Para cada una: hipótesis de causa + plan de mejora + métricas de éxito.\n    - Presentalo al manager. Negociá tiempo para implementar.\n    - Trackeá si funcionó.\n\n## Entregable\n\nNO es código. Es:\n- 1 ADR escrito y compartido (ej. 1).\n- 1 RFC propuesto (ej. 4).\n- 1 postmortem real o análisis (ej. 12-14).\n- 1 blog post o tech talk (ej. 16-17).\n- Onboarding plan para tu proyecto (ej. 22).\n\nSi hacés esto bien, en 1 año tu carrera cambió de nivel. Garantizado.\n\n---\n\n## 🎓 Cierre del Track Senior\n\nCompletaste los 8 módulos. Ahora:\n\n1. **Aplicá**. Estos conocimientos sin práctica real son inertes.\n2. **Construí** proyectos donde puedas ejercer estos patrones.\n3. **Mentoreá** a alguien — explicar fija aprendizaje.\n4. **Documentá** tus decisiones — tu yo del futuro lo agradece.\n5. **Buscá feedback** activo — la única forma de calibrar tu nivel.\n\nEl curso termina. Tu camino de senior empieza.\n"</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
