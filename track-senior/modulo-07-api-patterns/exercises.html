<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S7 · Ejercicios — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../../index.html">← Portal</a>
      <div class="right">
        <a href="../../lectures.html#s7">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set S-07 — API Patterns\n\n## Sección A — REST bien hecho\n\n1. Diseñá una **REST API** para un blog con: posts, comments, users, tags. Especificá endpoints completos:\n   - CRUD para cada recurso.\n   - Paginación cursor-based.\n   - Filtering (`?tag=react&status=published`).\n   - Sparse fieldsets (`?fields=id,title,excerpt`).\n   - Includes (`?include=author,comments`).\n   - Versionado (URL o header).\n   - Status codes correctos por escenario.\n\n2. Documentala en **OpenAPI 3.0**. Generá:\n   - Tipos TS con `openapi-typescript`.\n   - Cliente con `openapi-fetch`.\n   - Mock server con `prism` para desarrollar sin backend.\n\n3. **Anti-patrón hunting**: tomá una API real (de un servicio que uses) y listá 5 cosas que **mejorarías** en su diseño REST.\n\n## Sección B — GraphQL\n\n4. Setup GraphQL server con **Apollo Server** o **Yoga**:\n   - Schema con User, Post, Comment.\n   - Queries, mutations, subscription para new comments.\n   - DataLoader para evitar N+1.\n   - Authorization con context.\n\n5. Setup cliente con **Apollo Client** + `graphql-codegen`:\n   - Hooks tipados generados desde el schema.\n   - Caché normalizado (`InMemoryCache`).\n   - Optimistic updates en mutations.\n\n6. **Comparativa**: implementá la MISMA feature (lista de posts con autor + comments) en REST y en GraphQL. Compará:\n   - Cantidad de requests.\n   - Tamaño total transferido.\n   - Líneas de código en el cliente.\n   - Type safety.\n\n## Sección C — tRPC\n\n7. Setup tRPC en una app full-stack TS:\n   - Router con `user.byId`, `user.create`, `post.list`, `post.create`.\n   - Validación con Zod.\n   - Autenticación via context.\n   - Cliente con hooks (`trpc.user.byId.useQuery`).\n\n8. **Tipos compartidos**: cambiá un campo en el server (ej: `name: string` → `firstName: string, lastName: string`). Verificá que el cliente TS te avisa errores en compile time **sin codegen**.\n\n9. **Subscription** con tRPC + WebSocket: implementá notificaciones en tiempo real cuando se crea un nuevo post.\n\n## Sección D — BFF\n\n10. Diseñá un BFF para una app de e-commerce. Endpoints:\n    - `GET /api/dashboard` — orquesta sales + analytics + user info.\n    - `GET /api/product/:id` — combina product + reviews + related + inventory.\n    - `POST /api/checkout` — orquesta inventory check + payment + shipping + email.\n\n11. Implementá uno con **Hono** (rápido, edge-ready):\n    - Habla con 3 microservices mockeados.\n    - Cache con Redis (mock o real).\n    - Rate limiting por user.\n    - Errores estructurados con codes consistentes.\n\n## Sección E — Caching strategies\n\n12. **HTTP cache**: configurá tu app deployada con:\n    - Assets con hash → `Cache-Control: max-age=31536000, immutable`.\n    - HTML → `Cache-Control: no-cache`.\n    - API responses → `Cache-Control: private, max-age=60`.\n    - Verificá con DevTools Network y curl.\n\n13. **TanStack Query** avanzado:\n    - `staleTime` y `gcTime` ajustados por tipo de data.\n    - `refetchOnWindowFocus` configurado por query.\n    - **Prefetch** de la próxima página al hacer hover en \"Next\".\n    - **Invalidación tag-based** después de mutations.\n\n14. **Optimistic update** completo en una feature de likes:\n    - Click → UI cambia instantáneo.\n    - Si falla server → rollback con feedback visual.\n    - Si falla red → retry con exponential backoff.\n\n## Sección F — Real-time\n\n15. Implementá las 3 estrategias para una feature de notificaciones:\n    - **a) Polling** cada 30s con TanStack Query.\n    - **b) SSE** con `EventSource`.\n    - **c) WebSocket** con Socket.IO.\n\n    Compará en latency, complejidad, escalabilidad.\n\n16. **Reconnection logic** para WebSocket:\n    - Exponential backoff con jitter.\n    - Heartbeat ping/pong.\n    - State machine: `disconnected → connecting → connected → reconnecting`.\n    - Buffer de eventos durante desconexión, replay al reconectar.\n\n## Sección G — Errores y resilience\n\n17. **Error structure tipada**:\n    ```ts\n    type ApiError =\n      | { code: 'NOT_FOUND'; message: string }\n      | { code: 'VALIDATION'; message: string; field: string }\n      | { code: 'RATE_LIMITED'; message: string; retryAfter: number };\n    ```\n    Implementá un client wrapper que devuelva `Result<T, ApiError>` (no throws).\n\n18. **Circuit breaker** en el cliente:\n    - Si un endpoint falla 5 veces en 1 min → \"open\" por 30s.\n    - Mientras \"open\" → falla rápido sin pegar al server.\n    - Después intenta \"half-open\" para probar.\n\n19. **Retry con backoff** correcto:\n    - 4xx → no reintentes (excepto 408, 429).\n    - 5xx → hasta 3 reintentos.\n    - Backoff exponencial con jitter random.\n    - Total timeout configurable.\n\n## Sección H — Decisión arquitectónica\n\n20. **Caso de estudio**: empresa con backend monolito Rails, app React web, app React Native mobile, admin Vue. Equipos: 6 backend, 4 web, 3 mobile, 2 admin. ¿Qué API style sugerís? Argumentá pros y cons de:\n    - Mantener REST.\n    - Migrar a GraphQL.\n    - Adoptar tRPC para web (manteniendo REST para mobile).\n    - Introducir BFFs.\n\n    Escribí el ADR como si fuera para tu equipo real.\n\n## Desafío\n\n21. **API completa de un mini Twitter**:\n    - Diseñá el schema GraphQL con: User, Tweet, Like, Follow, Notification.\n    - Implementá server con Apollo + Prisma.\n    - Cliente con Apollo + codegen + optimistic updates en likes.\n    - Subscriptions para notifications real-time.\n    - DataLoader para evitar N+1.\n    - Authorization granular (puedo borrar mi tweet, no el de otro).\n\n22. **Migration paper**: tu empresa tiene API REST con 50 endpoints. Equipo quiere migrar a GraphQL. Escribí:\n    - ADR con análisis costo/beneficio.\n    - Plan de migración incremental (no big bang).\n    - Métricas de éxito.\n    - Plan de rollback si la migración falla.\n    - Cómo manejar deprecation de endpoints REST.\n\n## Entregable\n\nRepo `cs-fe-senior-s07-api` con:\n- API REST + OpenAPI + tipos generados (ej. 1-2).\n- Mismo feature en REST y GraphQL para comparar (ej. 6).\n- App tRPC completa (ej. 7-9).\n- Mini Twitter con GraphQL real-time (ej. 21).\n- ADR del análisis de migración (ej. 22).\n"</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
