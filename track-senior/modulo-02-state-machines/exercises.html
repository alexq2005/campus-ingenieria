<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S2 · Ejercicios — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../../index.html">← Portal</a>
      <div class="right">
        <a href="../../lectures.html#s2">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set S-02 — State Machines & State Managers\n\n## Sección A — Detectar estados imposibles\n\n1. En este componente, listá **todos los estados imposibles** que puede alcanzar:\n\n```tsx\nconst [loading, setLoading] = useState(false);\nconst [submitting, setSubmitting] = useState(false);\nconst [success, setSuccess] = useState(false);\nconst [error, setError] = useState(null);\nconst [data, setData] = useState(null);\n```\n\n2. Refactorizalo a un solo `state: 'idle' | 'loading' | 'success' | 'error' | 'submitting'` con discriminated union. Listá cuántos estados tenías antes vs después.\n\n## Sección B — useReducer\n\n3. Construí un **carrito de compras** con `useReducer`. Tipo:\n   - `add(item)` — si ya existe, incrementa cantidad; si no, agrega.\n   - `remove(id)` — quita totalmente.\n   - `updateQty(id, qty)` — si qty=0, equivale a remove.\n   - `clear()`\n   - `applyCoupon(code)` — actualiza un descuento si el cupón es válido.\n\n4. Tests del reducer (sin React, con Vitest):\n```ts\ntest('add item nuevo lo agrega con cantidad 1', () => { ... });\ntest('add item existente incrementa cantidad', () => { ... });\ntest('updateQty con 0 lo elimina', () => { ... });\n```\n\n## Sección C — XState básico\n\n5. Modelá la máquina de un **semáforo de 3 luces** con XState. Transiciones automáticas con `after` (delays). Verde dura 5s, amarillo 1s, rojo 4s.\n\n6. Modelá un **lead form de 3 pasos**: `step1 → step2 → step3 → submitting → success | error`. Permití `back` desde cualquier step. En `submitting`, NO se permite ir back ni adelante.\n\n7. Convertí esta lógica imperativa a XState:\n\n```ts\nlet isLoading = false;\nlet isAuth = false;\nlet user = null;\nasync function login() {\n  if (isLoading) return;\n  isLoading = true;\n  try {\n    user = await api.login();\n    isAuth = true;\n  } catch (e) { /* show error */ }\n  isLoading = false;\n}\n```\n\n## Sección D — Trade-off: Redux vs Zustand\n\n8. Para cada escenario, decidí qué usarías y argumentá:\n   - a) Startup, 3 devs, app de tracking de tareas con persistencia local.\n   - b) Empresa fintech, 25 devs, audit trail estricto, time-travel debugging clave.\n   - c) Single-page tool con muchos formularios reactivos interdependientes.\n   - d) E-commerce con catálogo + carrito + checkout multi-step + auth.\n\n9. Mismo carrito del ejercicio 3 — ahora implementalo en:\n   - **a) Zustand**\n   - **b) Jotai** (pista: un atom por categoría de estado)\n   - **c) Redux Toolkit** con `createSlice`\n\n   Compará líneas de código, número de archivos, y cuán \"natural\" se siente cada API.\n\n## Sección E — Server vs Client state\n\n10. **Refactor**: tomá esta app y separá server state (a TanStack Query) de client state (a Zustand):\n\n```tsx\nfunction App() {\n  const [users, setUsers] = useState([]);\n  const [filter, setFilter] = useState('all');\n  const [theme, setTheme] = useState('light');\n  const [selectedUserId, setSelectedUserId] = useState(null);\n\n  useEffect(() => {\n    fetch('/api/users').then(r => r.json()).then(setUsers);\n  }, []);\n\n  const filtered = filter === 'all' ? users : users.filter(u => u.role === filter);\n  // ...\n}\n```\n\n¿Qué va a TanStack Query? ¿Qué a Zustand? ¿Qué queda como `useState` local?\n\n## Sección F — Patterns de optimización\n\n11. Identificá los **3 anti-patrones de performance** en este componente y arreglalos:\n\n```tsx\nfunction Dashboard() {\n  const store = useStore();  // ← anti-patrón 1\n  const [count, setCount] = useState(0);\n  const [items, setItems] = useState([]);\n  const [total, setTotal] = useState(0);  // ← anti-patrón 2\n\n  const handleClick = () => { /* ... */ };  // ← anti-patrón 3 (en hijos memoizados)\n\n  return (\n    <div>\n      <UserName user={store.user} />\n      <Cart items={items} total={total} onItemClick={handleClick} />\n    </div>\n  );\n}\n```\n\n## Sección G — XState avanzado\n\n12. Diseñá una **máquina de upload de archivo** con estos requirements:\n   - Estados: `idle, selecting, uploading, paused, success, error`.\n   - En `uploading`: progreso con `context.percent`, eventos `PROGRESS`, `PAUSE`, `CANCEL`.\n   - En `paused`: puede `RESUME` o `CANCEL`.\n   - Auto-retry x3 en `error` con exponential backoff.\n   - Usá `invoke` para el upload async, y `assign` para el progress.\n\n13. Visualizalo en **stately.ai/viz** y exportá el screenshot del statechart.\n\n## Desafío\n\n14. **Mini Spotify**: implementá un music player con estos estados:\n    - `idle, loading, playing, paused, ended, error`\n    - Cola de canciones (`queue`)\n    - Auto-next al `ended`\n    - Repeat one / repeat all / shuffle\n    - Volume (con context)\n    - Persistencia de la cola en localStorage\n\n    Modelalo con XState. Sin librería de UI específica — solo el state.\n\n15. **Trade-off paper**: escribí un **ADR** decidiendo el stack de state management para una hipótetica app nueva (vos elegís el dominio). Considerá:\n    - Tamaño del equipo\n    - Complejidad esperada\n    - Server state vs client state\n    - Costo de cambio futuro\n    - Curva de aprendizaje\n\nMínimo 2 páginas. Esto es lo que un senior escribe en su trabajo real.\n\n## Entregable\n\nRepo `cs-fe-senior-s02-state` con:\n- Implementación del carrito en las 3 librerías (ej. 9).\n- Máquina de upload con XState (ej. 12).\n- Mini Spotify (ej. 14).\n- Tu ADR (ej. 15).\n\nTu portafolio empieza a verse senior con este tipo de proyectos.\n"</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
