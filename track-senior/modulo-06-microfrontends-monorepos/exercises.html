<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S6 · Ejercicios — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../../index.html">← Portal</a>
      <div class="right">
        <a href="../../lectures.html#s6">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set S-06 — Micro-frontends & Monorepos\n\n## Sección A — Análisis\n\n1. Tomá una empresa que conozcas (o open source: Microsoft, Spotify, Shopify). Investigá:\n   - ¿Usa monorepo o multi-repo?\n   - ¿Micro-frontends? Si sí, ¿qué estrategia (iframes, MF, Single-SPA)?\n   - ¿Qué problemas dice que resuelve?\n   - ¿Qué trade-offs aceptaron?\n\n2. Para tu propia situación (proyecto actual o último), respondé:\n   - ¿Sufrís de los problemas que resuelven monorepos/MF?\n   - ¿Qué evidencia? (tiempos de build, conflictos, incidentes)\n   - ¿Justifica el costo de adopción?\n\n## Sección B — Monorepo básico\n\n3. Creá un monorepo desde cero con pnpm workspaces:\n   ```\n   my-monorepo/\n   ├── packages/\n   │   ├── ui/           (React component lib)\n   │   └── utils/        (helpers TS)\n   └── apps/\n       ├── web/          (Vite + React)\n       └── admin/        (Vite + React)\n   ```\n   - Ambas apps consumen `@miorg/ui` y `@miorg/utils`.\n   - Cambiar una util y verificar que ambas apps reflejan el cambio sin republish.\n\n4. Agregá Turborepo:\n   - Pipeline: lint → typecheck → test → build.\n   - `dependsOn: [\"^build\"]` para que las apps esperen a sus deps.\n   - Verificá que `turbo run build` cachea (segunda corrida instantánea).\n\n5. **Caché remota**: configurá Turborepo + Vercel para compartir caché entre devs. Hacé que un colega corra `turbo build` y vea hits del caché.\n\n## Sección C — Design system en monorepo\n\n6. En `packages/ui`, construí:\n   - Design tokens (colors, spacing, typography) en `tokens/`.\n   - 5 primitives: `Button`, `Input`, `Card`, `Modal`, `Badge`.\n   - Storybook configurado.\n   - Tests con Vitest + RTL.\n   - Build output que las apps importan: `@miorg/ui` y `@miorg/ui/css`.\n\n7. **Visual regression**: setup Chromatic. Hacé un cambio sutil al `<Button>` y verificá que el PR pide aprobación visual.\n\n8. **Versionado independiente**: implementá Changesets (`@changesets/cli`).\n   - Hacé un cambio breaking en `<Button>`.\n   - Generá un changeset.\n   - Mergeá → release de `ui@2.0.0`.\n   - Apps pinean a `^1.0.0` o suben a `^2.0.0`.\n\n## Sección D — Module Federation\n\n9. Setup mínimo con Vite:\n   - **Host**: `apps/shell` que carga remotes.\n   - **Remote**: `apps/cart` que expone `<CartButton>`.\n   - Verificá: el host carga el componente del remote en runtime.\n\n10. Deploy independiente:\n    - Deployar `cart` a `cart.miapp.com/v1/remoteEntry.js`.\n    - Deployar `shell` apuntando a esa URL.\n    - Cambiar el cart, deploy a `v2`, actualizar manifest sin re-deploy del shell.\n\n11. **Shared dependencies**:\n    - Configurar `react`, `react-dom`, `react-router` como `shared` con `singleton: true`.\n    - Verificar en DevTools que se carga UNA vez.\n\n12. **Error boundary** alrededor de cada remote:\n    - Si `cart` no responde, mostrar fallback en vez de romper toda la página.\n    - Logging del error a Sentry con tag del remote afectado.\n\n## Sección E — Comunicación entre micro-frontends\n\n13. Implementá los 3 patrones de comunicación:\n    - **Custom events**: `cart:item-added` con typed schema.\n    - **Shared store** (zustand via Module Federation): `useGlobalStore` accesible desde cualquier remote.\n    - **URL state**: `?coupon=ABC` que cualquier remote puede leer.\n    \n    Compará: facilidad, acoplamiento, debug-ability.\n\n14. **Contracts versionados**:\n    - Cart V1 expone `<CartButton onAdd={fn} />`.\n    - Cart V2 cambia a `<CartButton onAddItem={fn} />` (breaking).\n    - Implementá: el shell mantiene compatibilidad temporal con ambos hasta que todos consumers migren.\n\n## Sección F — Trade-offs y decisión\n\n15. Para cada escenario, decidí monorepo vs multi-repo, monolito vs micro-frontends:\n    - a) Startup 4 devs, 1 producto, MVP.\n    - b) Empresa 50 devs, 3 productos relacionados (web app, admin, mobile RN).\n    - c) Adquirieron una empresa con stack Vue, ustedes son React, hay que integrar.\n    - d) Open source library con 5 maintainers globales.\n\n16. **Anti-patrón paper**: investigá un caso público donde una empresa adoptó MF y se arrepintió (Klarna, ThoughtWorks reports). ¿Qué aprendieron?\n\n## Sección G — DevOps en monorepo\n\n17. **CI inteligente con `turbo affected`**:\n    ```yaml\n    # .github/workflows/ci.yml\n    - run: turbo run test --filter='...[origin/main]'\n    ```\n    Verificá: si tocás solo `apps/admin`, NO se corren tests de `apps/web`.\n\n18. **Deploy selectivo**:\n    - Sistema que detecta qué apps cambiaron en el merge.\n    - Solo deploya esas apps a producción.\n    - Bonus: matriz GitHub Actions paralelizando deploys.\n\n## Desafío\n\n19. **Micro-frontend production-grade**:\n    - Monorepo (Turborepo) con `shell + 3 remotes` (cart, search, profile).\n    - Module Federation con shared deps.\n    - Cada remote deploya independiente a Vercel/Netlify.\n    - Error boundaries con Sentry.\n    - Storybook + Chromatic para el design system compartido.\n    - CI que solo testea/buildea lo afectado.\n    - ADR documentando las decisiones.\n\n20. **Migración hipotética**: tomá una app monolítica (puede ser mock) de 50K líneas. Documentá:\n    - Plan de migración a MF en 6 meses.\n    - Métricas de éxito (build time, deploy frequency, etc.).\n    - Riesgos y mitigaciones.\n    - Plan de rollback si la migración falla.\n\n    Esto es lo que un staff engineer escribe en su trabajo.\n\n## Entregable\n\nRepo `cs-fe-senior-s06-monorepo` con:\n- Monorepo Turborepo funcionando (ej. 3-4).\n- Design system con changesets (ej. 6-8).\n- Setup MF con shell + remotes (ej. 9-12).\n- ADRs documentando decisiones.\n- README con diagrama de la arquitectura.\n"</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
