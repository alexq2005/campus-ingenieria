<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicios PS7 — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../../index.html">← Portal</a>
      <div class="right">
        <a href="../../lectures.html#m7">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set 7 — JavaScript moderno\n\n## Sección A — Destructuring y spread\n\n1. Dado `const arr = [1, 2, 3, 4, 5]`, extraé el primero, el último, y todos los del medio en 3 variables con **una sola línea** de destructuring.\n\n2. Dado:\n```js\nconst config = {\n  server: { host: 'localhost', port: 3000 },\n  db: { name: 'app', user: 'admin' }\n};\n```\nExtraé `host`, `port`, y `user` en variables separadas con una sola línea.\n\n3. Escribí una función `merge(...objs)` que combine N objetos. El último pisa al primero. **Sin `Object.assign`**, usando spread.\n\n4. Implementá `omit(obj, ...claves)` que devuelva una copia del objeto sin las claves indicadas. Ej: `omit({a:1, b:2, c:3}, 'a', 'c') → { b: 2 }`.\n\n5. Implementá `pick(obj, ...claves)` que devuelva solo las claves indicadas.\n\n## Sección B — Clases\n\n6. Modelá `Vehiculo → Auto → AutoElectrico` con herencia. El último debe tener un campo privado `#bateria` (0-100%) y método `cargar(pct)`.\n\n7. Implementá una clase `Pila` (stack, LIFO) con `push`, `pop`, `peek`, `size`, `clear`. Con campos privados.\n\n8. Implementá una clase `Cola` (queue, FIFO) con `enqueue`, `dequeue`, `front`, `size`.\n\n9. Implementá `EventEmitter` (patrón observer): métodos `on(evento, cb)`, `off(evento, cb)`, `emit(evento, ...args)`. Usá `Map<string, Set<fn>>`.\n\n## Sección C — Módulos\n\n10. Separá el TODO app del módulo 6 en archivos:\n   - `storage.js` — funciones `load()` y `save(todos)`.\n   - `todos.js` — clase `TodoList` con métodos `add`, `remove`, `toggle`, `filter`.\n   - `ui.js` — funciones `render(todos)` y bindeo de eventos.\n   - `main.js` — entry point que importa los 3.\n\n   Serví con Live Server o `npx serve`.\n\n11. Creá un módulo `utils.js` con funciones de ayuda: `debounce`, `throttle`, `memoize`, `formatDate`. Usalo con `import { ... } from './utils.js'`.\n\n## Sección D — Map, Set, y tipos especiales\n\n12. Dado un array de palabras, contá las ocurrencias de cada una **sin usar un objeto plano** — usá `Map`. Devolvé un `Map<string, number>`.\n\n13. Dado un array con duplicados de objetos (usuarios por `id`), desduplicá conservando el más reciente. Usá `Map` indexado por `id`.\n\n14. Implementá una \"caché LRU\" (Least Recently Used) de tamaño N: cuando la caché está llena y se inserta uno nuevo, se elimina el menos recientemente usado. Pista: `Map` mantiene el orden de inserción — eso es la mitad del trabajo.\n\n## Sección E — Iteradores y generators\n\n15. Escribí un generator `range(start, end, step = 1)` que funcione con `for...of` y `[...range(1, 10, 2)]`.\n\n16. Escribí un generator `fibonacci()` **infinito**. Usá `take(n, iter)` para tomar los primeros N.\n\n## Sección F — Refactor con ES modernos\n\n17. Tomá este código \"viejo\" y modernizalo:\n```js\nvar users = [\n  { name: 'Ada', age: 30 },\n  { name: 'Lin', age: 25 }\n];\nfunction getNames(arr) {\n  var names = [];\n  for (var i = 0; i < arr.length; i++) {\n    names.push(arr[i].name);\n  }\n  return names;\n}\nfunction findByName(arr, name) {\n  for (var i = 0; i < arr.length; i++) {\n    if (arr[i].name === name) return arr[i];\n  }\n  return null;\n}\n```\n\n## Desafío\n\n18. Implementá una **state machine mínima** con clases:\n```js\nconst tsm = new StateMachine({\n  initial: 'idle',\n  transitions: [\n    { from: 'idle',   on: 'start',  to: 'running' },\n    { from: 'running', on: 'pause', to: 'paused' },\n    { from: 'paused', on: 'resume', to: 'running' },\n    { from: 'running', on: 'stop',  to: 'idle' },\n  ]\n});\ntsm.fire('start');  // running\ntsm.fire('pause');  // paused\ntsm.on('enter:running', () => console.log('corriendo!'));\n```\n\n19. **Pipe + compose**: `pipe(f, g, h)(x) = h(g(f(x)))` y `compose(f, g, h)(x) = f(g(h(x)))`. Escribilos como funciones variádicas.\n\n## Entregable\n\nUn repo en GitHub con carpetas `ps7/` + `modulos/`. Readme explicando cómo ejecutarlo (`npx serve`).\n"</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
