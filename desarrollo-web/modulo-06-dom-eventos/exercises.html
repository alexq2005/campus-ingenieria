<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicios PS6 — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../../index.html">← Portal</a>
      <div class="right">
        <a href="../../lectures.html#m6">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set 6 — DOM y eventos\n\n## Sección A — Selección y manipulación\n\n1. En una página con un `<ul>` de 5 `<li>`, escribí JS que:\n   - Pinte el primer `<li>` de azul.\n   - Pinte el último de rojo.\n   - Pinte los pares de amarillo.\n   - Agregue la clase `.long` a cualquier `<li>` con más de 10 caracteres.\n\n2. Dado:\n```html\n<ul class=\"cards\">\n  <li class=\"card\" data-id=\"1\" data-priority=\"3\">Tarea A</li>\n  <li class=\"card\" data-id=\"2\" data-priority=\"1\">Tarea B</li>\n  <li class=\"card\" data-id=\"3\" data-priority=\"2\">Tarea C</li>\n</ul>\n```\nOrdená visualmente las `<li>` por `data-priority` ascendente, sin cambiar el HTML original (modificá el DOM en memoria).\n\n## Sección B — Eventos\n\n3. **Contador click** con tres botones: +1, -1, reset. Mostrar el valor. Bonus: cambiar color rojo si es negativo, verde si > 0.\n\n4. **Modal**: un botón \"Abrir\" que muestre un modal con un botón \"Cerrar\". Además se cierra con la tecla `Escape` o al cliquear fuera del modal. Pensá delegation y `e.target`.\n\n5. **Validación en vivo**: un input email que muestra \"✅ válido\" o \"❌ inválido\" debajo mientras el usuario tipea (usá `e.target.validity.valid`).\n\n## Sección C — Event delegation\n\n6. Galería de 12 imágenes. Al hacer click en cualquier imagen, mostrar esa imagen en grande en un área fija. **Un solo listener** en el contenedor de la galería.\n\n7. Tabla de 100 filas generadas por JS. Cada fila tiene un botón \"Eliminar\" y una casilla \"Seleccionar\". Manejá todo con **1 listener en la tabla**. Mostrá cuántas filas están seleccionadas en la parte superior.\n\n## Sección D — Formularios y storage\n\n8. **Formulario que se autosalva**: un formulario con 4 campos. Mientras el usuario tipea, guardar en `localStorage`. Al recargar, rellenar los campos con lo guardado. Botón \"Limpiar\".\n\n9. **App de notas**: crear, editar, borrar notas. Persisten en `localStorage`. Cada nota tiene título y contenido. Mostrar fecha de creación (usá `toLocaleDateString`).\n\n## Sección E — Patrones\n\n10. Implementá tu propio `debounce(fn, ms)` y `throttle(fn, ms)` desde cero. Probalos con el evento `mousemove` mostrando la posición — compará los disparos.\n\n11. **Ordenable por click**: una tabla de 5 columnas. Al hacer click en un `<th>`, ordenar las filas por esa columna. Segundo click, ordenar descendente. Indicador visual de columna activa (ej: flecha ▲/▼).\n\n12. **Drag & drop entre listas**: dos `<ul>`. Podés arrastrar `<li>` entre ellas. Guardá el estado en `localStorage` para que persista al recargar. (Usá la HTML5 Drag & Drop API: `dragstart`, `dragover`, `drop`.)\n\n## Sección F — Pequeñas apps completas\n\n13. **Carrito de compras**:\n    - Lista de productos con botón \"Agregar\".\n    - Sidebar con items en el carrito (cantidad, subtotal, botón quitar).\n    - Total en tiempo real.\n    - Persistencia en `localStorage`.\n\n14. **Quiz**:\n    - 10 preguntas multiple choice.\n    - Marca correcta/incorrecta al instante con color.\n    - Puntaje final + % aprobado.\n    - Botón \"Reiniciar\".\n\n15. **Simón (memoria de colores)**:\n    - 4 botones de colores.\n    - La máquina muestra una secuencia creciente.\n    - El usuario la repite. Si acierta, se agrega un color.\n    - Si falla, game over con puntaje.\n\n## Desafío\n\n16. **Virtual DOM mini**: implementá una función `renderLista(arr)` que solo actualice los elementos `<li>` que cambiaron respecto al render anterior. Usá `key` (id) para identificarlos. Esto es el core conceptual de React.\n\n17. **Reactividad a mano**: implementá un objeto observable:\n```js\nconst state = observable({ nombre: 'Ada' });\nbindText('#titulo', state, 'nombre');\nstate.nombre = 'Lin';   // el <h1> se actualiza solo\n```\n\n## Entregable\n\nUna carpeta `ps6/` con al menos 5 archivos HTML. Bonus: deployá a GitHub Pages y compartí los links.\n"</script>
  <script src="../../assets/vendor/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
