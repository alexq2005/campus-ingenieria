<h1>⚛️ useEffect Visualizer</h1>
<p class="subtitle">Cambiá las dependencias y mirá CUÁNDO corre el effect y su cleanup. <strong>Corre en tu browser, sin instalar nada.</strong></p>

<div id="root"></div>

</div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function Visualizer() {
  const [count, setCount] = useState(0);
  const [nombre, setNombre] = useState('Ana');
  const [depMode, setDepMode] = useState('count'); // 'none' | 'empty' | 'count'
  const [log, setLog] = useState([]);
  const logIdRef = useRef(0);

  function addLog(tipo, texto) {
    setLog(prev => [...prev, { id: logIdRef.current++, tipo, texto, time: new Date().toLocaleTimeString() }]);
  }

  // El effect cuya dependencia el usuario controla
  // Nota: usamos depMode para decidir las deps. En cada cambio de modo, React
  // re-evalúa. Para fines de demo, usamos un effect que loguea.
  const deps = depMode === 'none' ? undefined
             : depMode === 'empty' ? []
             : [count];

  useEffect(() => {
    addLog('effect', `▶ EFFECT corrió (modo deps: ${depMode === 'none' ? 'sin array' : depMode === 'empty' ? '[]' : '[count]'}) — count=${count}`);

    return () => {
      addLog('cleanup', `✖ CLEANUP corrió`);
    };
  }, deps);

  return (
    <div className="demo-box">
      <div style={{ marginBottom: 16 }}>
        <label>Modo de dependencias del effect:</label>
        <select value={depMode} onChange={(e) => { setDepMode(e.target.value); setLog([]); }}>
          <option value="none">useEffect(fn) — sin array (corre en CADA render)</option>
          <option value="empty">useEffect(fn, []) — solo al montar</option>
          <option value="count">useEffect(fn, [count]) — cuando count cambia</option>
        </select>
      </div>

      <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap', marginBottom: 16 }}>
        <div>
          <p>count: <strong style={{ color: '#61dafb', fontSize: 20 }}>{count}</strong></p>
          <button onClick={() => setCount(c => c + 1)}>count + 1</button>
        </div>
        <div>
          <p>nombre: <strong style={{ color: '#fb7185' }}>{nombre}</strong></p>
          <input value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="cambiá el nombre" />
        </div>
      </div>

      <button className="secondary" onClick={() => setLog([])}>Limpiar log</button>

      <div className="log" style={{ marginTop: 12 }}>
        {log.length === 0
          ? <div className="log-render">Cambiá count o nombre y mirá cuándo corre el effect...</div>
          : log.slice(-12).map(l => (
              <div key={l.id} className={l.tipo === 'effect' ? 'log-effect' : 'log-cleanup'}>
                [{l.time}] {l.texto}
              </div>
            ))}
      </div>

      <div className="explain" style={{ marginTop: 16 }}>
        <strong>Probá esto:</strong>
        <ul style={{ marginLeft: 18, marginTop: 6 }}>
          <li><strong>Sin array</strong>: cambiá el NOMBRE → el effect corre igual (cualquier render lo dispara).</li>
          <li><strong>[]</strong>: cambiá count o nombre → el effect NO vuelve a correr (solo al montar).</li>
          <li><strong>[count]</strong>: cambiá count → corre. Cambiá nombre → NO corre (no está en deps).</li>
          <li>Notá que el <span style={{ color: '#fb7185' }}>cleanup (rojo)</span> corre ANTES del próximo effect.</li>
        </ul>
      </div>
    </div>
  );
}

function App() {
  return (
    <div>
      <Visualizer />

      <h2>El effect que estás viendo</h2>
      <pre><code>{`useEffect(() => {
  console.log('▶ EFFECT corrió');

  return () => {
    console.log('✖ CLEANUP corrió');
  };
}, deps);  // deps cambia según el selector de arriba`}</code></pre>

      <div className="explain">
        <strong>La regla de oro:</strong> el array de dependencias controla CUÁNDO
        se re-ejecuta el effect. Sin array = cada render. Con <code>[]</code> = solo
        al montar. Con <code>[x]</code> = cuando <code>x</code> cambia. El cleanup
        corre antes de cada re-ejecución y al desmontar.
      </div>

      <h2>El caso real: timer con cleanup</h2>
      <pre><code>{`useEffect(() => {
  const id = setInterval(() => tick(), 1000);
  return () => clearInterval(id);  // sin esto: timer zombie
}, []);`}</code></pre>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
