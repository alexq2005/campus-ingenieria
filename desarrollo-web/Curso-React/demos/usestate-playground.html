<div class="wrap">

<h1>⚛️ useState Playground</h1>
<p class="subtitle">Demo interactivo en vivo. Tocá los botones y observá cómo <code>useState</code> dispara re-renders. <strong>Corre en tu browser, sin instalar nada.</strong></p>

<div id="root"></div>

</div>

<script type="text/babel">
const { useState, useRef } = React;

// ─── Demo 1: contador de renders ───
function ContadorConRenders() {
  const [count, setCount] = useState(0);
  const renders = useRef(0);
  renders.current++;

  return (
    <div className="demo-box">
      <h3 style={{ marginBottom: 12 }}>1. Cada setState = un re-render</h3>
      <p>Estado <code>count</code>: <span className="badge-count">{count}</span></p>
      <p style={{ marginTop: 8 }}>
        Veces que se ejecutó la función componente:{' '}
        <span className="badge-count" style={{ background: '#fb7185' }}>{renders.current}</span>
      </p>
      <div style={{ marginTop: 12 }}>
        <button onClick={() => setCount(count + 1)}>setCount(count + 1)</button>
        <button className="secondary" onClick={() => setCount(0)}>Reset</button>
      </div>
      <div className="explain" style={{ marginTop: 12 }}>
        Cada click llama <code>setCount</code> → React vuelve a ejecutar la función →
        el render count sube. El render count vive en un <code>useRef</code> porque
        cambiarlo NO debe causar re-render (si no, loop infinito).
      </div>
    </div>
  );
}

// ─── Demo 2: batching ───
function BatchingDemo() {
  const [count, setCount] = useState(0);
  const [log, setLog] = useState([]);

  function tripleNaive() {
    // Las 3 leen el MISMO count → resultan +1, no +3
    setCount(count + 1);
    setCount(count + 1);
    setCount(count + 1);
    setLog(l => [...l, `Naive: 3× setCount(count+1) con count=${count} → solo +1`]);
  }

  function tripleUpdater() {
    // La forma updater SIEMPRE usa el valor más reciente → +3
    setCount(c => c + 1);
    setCount(c => c + 1);
    setCount(c => c + 1);
    setLog(l => [...l, `Updater: 3× setCount(c => c+1) → +3`]);
  }

  return (
    <div className="demo-box">
      <h3 style={{ marginBottom: 12 }}>2. Batching: por qué usar la forma updater</h3>
      <p>count: <span className="badge-count">{count}</span></p>
      <div style={{ marginTop: 12 }}>
        <button onClick={tripleNaive}>3× setCount(count + 1)</button>
        <button onClick={tripleUpdater} style={{ background: '#10b981' }}>3× setCount(c =&gt; c + 1)</button>
        <button className="secondary" onClick={() => { setCount(0); setLog([]); }}>Reset</button>
      </div>
      <div className="log" style={{ marginTop: 12 }}>
        {log.length === 0
          ? <div className="log-line">Probá ambos botones y compará el resultado...</div>
          : log.slice(-5).map((l, i) => <div key={i} className="log-line">→ {l}</div>)}
      </div>
      <div className="explain" style={{ marginTop: 12 }}>
        El botón naranja suma SOLO +1 aunque llame setCount 3 veces (las 3 leen el
        mismo <code>count</code> del closure). El verde suma +3 porque la forma
        <code>c =&gt; c + 1</code> recibe el valor más reciente. <strong>Por eso preferís la forma updater.</strong>
      </div>
    </div>
  );
}

// ─── Demo 3: objeto vs mutación ───
function ObjetoDemo() {
  const [user, setUser] = useState({ nombre: 'Ana', clicks: 0 });
  const [mutado, setMutado] = useState({ nombre: 'Luis', clicks: 0 });

  function correcto() {
    setUser(prev => ({ ...prev, clicks: prev.clicks + 1 }));
  }

  function incorrecto() {
    // ❌ Mutar el objeto — React NO detecta el cambio (misma referencia)
    mutado.clicks++;
    setMutado(mutado);  // misma referencia → no re-render
  }

  return (
    <div className="demo-box">
      <h3 style={{ marginBottom: 12 }}>3. Inmutabilidad: por qué NO mutar</h3>
      <div className="grid2">
        <div>
          <p style={{ color: '#10b981' }}>✅ Correcto (spread)</p>
          <p>{user.nombre}: <span className="badge-count">{user.clicks}</span></p>
          <button onClick={correcto} style={{ background: '#10b981' }}>+1 con spread</button>
        </div>
        <div>
          <p style={{ color: '#ef4444' }}>❌ Mutación</p>
          <p>{mutado.nombre}: <span className="badge-count">{mutado.clicks}</span></p>
          <button onClick={incorrecto} style={{ background: '#ef4444' }}>+1 mutando</button>
        </div>
      </div>
      <div className="explain" style={{ marginTop: 12 }}>
        El botón rojo SÍ incrementa <code>mutado.clicks</code> internamente, pero la UI
        NO se actualiza porque <code>setMutado(mutado)</code> pasa la MISMA referencia —
        React compara con <code>Object.is</code> y cree que nada cambió. El verde crea
        un objeto nuevo con <code>{'{...prev}'}</code> → React detecta el cambio.
        <br/><br/>
        <em>(Tip: si clickeás el verde después del rojo, vas a ver que el contador rojo
        "salta" — el valor mutado estaba ahí, solo faltaba el re-render.)</em>
      </div>
    </div>
  );
}

function App() {
  return (
    <div>
      <ContadorConRenders />
      <BatchingDemo />
      <ObjetoDemo />

      <h2>El código detrás</h2>
      <pre><code>{`function Contador() {
  const [count, setCount] = useState(0);

  return (
    <button onClick={() => setCount(c => c + 1)}>
      {count}
    </button>
  );
}`}</code></pre>
      <div className="explain">
        Esto es exactamente lo que corre arriba. React + Babel se cargan desde CDN
        y este archivo se transpila en el browser. En un proyecto real usarías Vite
        (sin Babel en runtime), pero el concepto es idéntico.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
