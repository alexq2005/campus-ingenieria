<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid — Holy Grail Layout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; min-height: 100vh; }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-areas:
        "header  header  header"
        "sidebar main    aside"
        "footer  footer  footer";
      grid-template-columns: 220px 1fr 220px;
      grid-template-rows: auto 1fr auto;
      gap: 0.5rem;
      padding: 0.5rem;
      background: #e2e8f0;
    }

    header, footer, .sidebar, main, aside {
      padding: 1.5rem;
      border-radius: 8px;
      background: white;
      display: grid;
      place-items: center;
      text-align: center;
    }

    header  { grid-area: header;  background: #0ea5e9; color: white; }
    footer  { grid-area: footer;  background: #334155; color: white; }
    .sidebar { grid-area: sidebar; background: #f1f5f9; }
    main    { grid-area: main;    background: #fafafa; font-size: 1.1rem; }
    aside   { grid-area: aside;   background: #f1f5f9; }

    /* Responsive: en móvil, todo en una columna */
    @media (max-width: 720px) {
      .page {
        grid-template-areas:
          "header"
          "main"
          "sidebar"
          "aside"
          "footer";
        grid-template-columns: 1fr;
      }
    }

    code { background: #1e293b; color: #e2e8f0; padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.85em; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Header</h1>
        <p><code>grid-area: header</code> — ancho completo</p>
      </div>
    </header>

    <div class="sidebar">
      <div>
        <strong>Sidebar</strong>
        <p><code>220px</code></p>
      </div>
    </div>

    <main>
      <div>
        <h2>Main</h2>
        <p>Ocupa el espacio sobrante con <code>1fr</code>.</p>
        <p>Achicá la ventana a menos de 720px y mirá cómo el layout colapsa a una sola columna sin tocar una línea extra de JS.</p>
      </div>
    </main>

    <aside>
      <div>
        <strong>Aside</strong>
        <p><code>220px</code></p>
      </div>
    </aside>

    <footer>
      <div>
        <p>&copy; Footer — <code>grid-area: footer</code></p>
      </div>
    </footer>
  </div>
</body>
</html>
