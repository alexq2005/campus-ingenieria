<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicios PS12 — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../../index.html">← Portal</a>
      <div class="right">
        <a href="../../lectures.html#m12">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set 12 — Performance, A11y, SEO\n\n## Sección A — Performance audit\n\n1. Corré Lighthouse en 3 sitios: uno tuyo (o uno local), uno grande (amazon.com o similar), y https://web.dev. Anotá:\n   - Performance score de cada uno.\n   - LCP, INP, CLS.\n   - Las 3 recomendaciones principales de cada auditoría.\n\n2. Tomá tu proyecto del módulo 10/11 y:\n   - Agregá `loading=\"lazy\"` a todas las imágenes.\n   - Convertí imágenes a WebP (squoosh.app).\n   - Definí `width` y `height` en cada `<img>`.\n   - Reemplazá animaciones de `width`/`height`/`top`/`left` por `transform`.\n   - Medí antes/después en Lighthouse.\n\n3. En Vite, generá el reporte de bundle:\n```bash\nnpm i -D rollup-plugin-visualizer\n```\n   - ¿Cuál es tu dependencia más grande?\n   - ¿Podés reemplazarla por algo más liviano (ej: dayjs en vez de moment)?\n\n## Sección B — Accesibilidad\n\n4. Instalá la extensión **axe DevTools**. Escaneá tu proyecto. Arreglá todos los errores críticos y serios.\n\n5. Navegá tu app **sin tocar el mouse**: solo `Tab`, `Shift+Tab`, `Enter`, `Space`, `Escape`, flechas. ¿Todo funciona? ¿Podés cerrar modales? ¿El foco siempre es visible?\n\n6. Tomá 5 pares de colores (fondo + texto) de tu app y verificá el contraste en https://webaim.org/resources/contrastchecker/. ¿Cuáles fallan AA?\n\n7. Configurá lectores de pantalla:\n   - Windows: instalá NVDA (gratis).\n   - Mac: activá VoiceOver (`Cmd+F5`).\n   - Navegá 3 páginas de tu proyecto usando solo el lector. ¿Tiene sentido lo que dice?\n\n8. Agregá soporte para `prefers-reduced-motion`: si el usuario lo activa, desactiva todas tus animaciones.\n\n9. Implementá **skip link**: un link \"Saltar al contenido principal\" que aparece solo al recibir foco. Útil para teclado y lectores.\n\n## Sección C — SEO\n\n10. Para tu proyecto principal:\n    - Agregá `<title>` y `<meta description>` a cada página.\n    - Agregá Open Graph y Twitter Cards.\n    - Probá cómo se ve la preview en https://metatags.io.\n\n11. Creá un `sitemap.xml` con al menos 5 URLs. Creá un `robots.txt` que lo referencie.\n\n12. Agregá **structured data** apropiado:\n    - Si tu app es un blog → `Article`.\n    - Si es un negocio → `LocalBusiness` y/o `Organization`.\n    - Si es un producto → `Product` con `offers` y `aggregateRating`.\n    Validá en https://search.google.com/test/rich-results.\n\n13. Implementá una **página 404** prolija con navegación de vuelta al home.\n\n## Sección D — Mobile\n\n14. Probá tu app en DevTools con device simulation: iPhone SE (320px), iPhone 14, iPad. Todo responsive.\n\n15. Medí Lighthouse en modo **Mobile** (más exigente que Desktop) y apuntá al mismo ≥90 en las 4 categorías.\n\n## Sección E — Proyecto aplicado\n\n16. Tomá un sitio real \"malo\" que conozcas (muchos sitios gubernamentales, de universidades, de pequeños comercios). Hacé un informe:\n    - Lighthouse scores.\n    - Top 5 problemas de accesibilidad (axe).\n    - Top 5 problemas de SEO.\n    - 10 recomendaciones priorizadas por impacto.\n\n## Desafío\n\n17. **PWA (Progressive Web App)**: convertí tu proyecto en PWA con:\n    - `manifest.json` (icono, nombre, colores).\n    - Service Worker básico (cache-first para assets estáticos).\n    - Instalable en móvil.\n\n18. **Critical CSS**: inline el CSS above-the-fold en el `<head>`, el resto en un archivo externo con `media=\"print\" onload=\"this.media='all'\"`.\n\n## Entregable\n\nUn Markdown con los scores antes/después y screenshots. Deploy a producción del proyecto optimizado.\n"</script>
  <script src="../../assets/vendor/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
