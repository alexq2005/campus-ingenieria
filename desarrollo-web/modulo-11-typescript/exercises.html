<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicios PS11 — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../../index.html">← Portal</a>
      <div class="right">
        <a href="../../lectures.html#m11">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set 11 — TypeScript\n\n## Sección A — Tipos básicos\n\n1. Definí un `type Libro` con `titulo`, `autor`, `año`, `paginas`, `etiquetas` (array de strings), `disponible` (bool), `editor` (opcional). Creá 3 libros. Tipá una función `buscarPorEtiqueta(libros: Libro[], tag: string): Libro[]`.\n\n2. Tipá una union `type Forma = Circulo | Cuadrado | Triangulo`. Cada una tiene un campo `tipo` discriminante. Escribí una función `area(f: Forma): number` usando `switch` con narrowing.\n\n3. Implementá la función `primero` así:\n```ts\nfunction primero<T>(arr: T[]): T | undefined { ... }\n```\ny confirmá que el tipo del retorno se infiere correctamente con `primero([1,2,3])` (debería ser `number | undefined`).\n\n## Sección B — Utility types\n\n4. Dado `type User = { id: number; nombre: string; email: string; password: string }`, escribí:\n   - `UserPublic` — sin `password` (usá `Omit`).\n   - `UserCreate` — sin `id` pero con todo lo demás.\n   - `UserUpdate` — todo opcional salvo `id`.\n\n5. Dado una función `const fn = (x: number, y: string) => ({ x, y })`, obtené:\n   - El tipo de sus parámetros con `Parameters<typeof fn>`.\n   - El tipo de su retorno con `ReturnType<typeof fn>`.\n\n## Sección C — Generics\n\n6. Implementá `Pair<A, B>` como un tipo genérico `{ first: A; second: B }`. Usalo con distintos tipos.\n\n7. Implementá una función `agrupar<T, K extends keyof T>(items: T[], key: K): Record<string, T[]>`.\n\n8. Implementá `Lazy<T>` — una clase genérica que recibe una fábrica `() => T`, la ejecuta la primera vez que pedís `.value`, y cachea el resultado.\n\n## Sección D — Discriminated unions\n\n9. Creá el tipo `RequestState<T>` con variantes `idle`, `loading`, `success` con `data`, `error` con `message`. Escribí una función que renderice cada caso a un string.\n\n10. Creá un tipo `Action` con variantes para un reducer de TODO: `{ type: 'ADD', texto: string }`, `{ type: 'REMOVE', id: number }`, `{ type: 'TOGGLE', id: number }`. Implementá el reducer con narrowing exhaustivo.\n\n## Sección E — React + TS\n\n11. Convertí el TODO app del módulo 10 (React vanilla) a TypeScript. Tipá:\n    - El tipo `Todo`.\n    - Props de cada componente.\n    - El custom hook `useLocalStorage<T>`.\n\n12. Creá un componente `<Select<T> options items onChange value />` **genérico** — que trabaje con cualquier tipo. Usa render props o generics en la firma.\n\n## Sección F — Type gymnastics\n\n13. Implementá `DeepReadonly<T>` que haga readonly todas las propiedades de un objeto, recursivamente.\n\n14. Implementá `DeepPartial<T>` igual pero con opcionales recursivos.\n\n15. Implementá `Paths<T>` que genere todas las rutas de un objeto anidado como string literals: `Paths<{ a: { b: { c: 1 } } }>` = `'a' | 'a.b' | 'a.b.c'`.\n\n## Desafío\n\n16. Tipá completamente la API de `fetch` con un helper:\n```ts\napi.get<User[]>('/users')\n   .post<User, CreateUserDto>('/users', body)\n   .delete<void>('/users/42');\n```\n\n17. **Expresión algebraica tipada**: `type Expr = Number | Add | Mul` que permita construir árboles de expresiones y evaluarlos con narrowing.\n\n## Entregable\n\nProyecto Vite + React + TS con strict mode activado. Todo el código tipado (cero `any`, cero `@ts-ignore`).\n"</script>
  <script src="../../assets/vendor/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
