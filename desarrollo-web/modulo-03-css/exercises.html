<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicios PS3 — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../../index.html">← Portal</a>
      <div class="right">
        <a href="../../lectures.html#m3">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set 3 — CSS fundamentos\n\n## Sección A — Cálculo de especificidad\n\nPara cada selector, calculá la especificidad en formato `a,b,c,d`:\n\n1. `p`\n2. `.btn`\n3. `#header`\n4. `ul li a`\n5. `nav .link:hover`\n6. `#main article.post h2`\n7. `a[href^=\"https\"]`\n8. `input:not([type=\"submit\"])`\n\nOrdená de menor a mayor especificidad.\n\n## Sección B — Debugging\n\n9. En este CSS, el `<h1>` sigue siendo negro. ¿Por qué? Arreglalo **sin usar `!important`**:\n\n```html\n<style>\n  h1.titulo { color: blue; }\n  #pagina h1 { color: black; }\n</style>\n<div id=\"pagina\">\n  <h1 class=\"titulo\">Hola</h1>\n</div>\n```\n\n10. Este botón no cambia al hacer hover. ¿Error?\n\n```css\nbutton:hover {\n  background: red !important;\n}\nbutton {\n  background: blue;\n}\n```\n\n(Truco: no hay error en CSS. El problema puede estar en otro lado — revisá orden, especificidad y si hay estilos más específicos).\n\n## Sección C — Box model\n\n11. Un elemento tiene: `width: 300px; padding: 16px; border: 2px solid; margin: 24px;`. Con `box-sizing: content-box`, ¿cuánto mide el \"espacio total ocupado\" en horizontal? ¿Y con `border-box`?\n\n12. ¿Por qué `margin: 0 auto` centra horizontalmente un elemento block con width definido, pero no funciona con inline? (Pensá el modelo de flujo).\n\n## Sección D — Construcción\n\n13. **Construí una \"tarjeta de perfil\"** (`tarjeta.html` + CSS inline en `<style>`):\n    - Width máximo 320px.\n    - `box-sizing: border-box`.\n    - Variables CSS para colores (mínimo: `--primary`, `--text`, `--surface`, `--border`).\n    - Foto circular (border-radius 50%).\n    - Nombre (h2), rol (p muted).\n    - Botones \"Seguir\" y \"Mensaje\" con `:hover` (cambio de color y micro-transform de -1px).\n    - Sombra sutil.\n    - **Soporte dark mode** con `@media (prefers-color-scheme: dark)`.\n\n14. **Sistema tipográfico fluido**. Usá `clamp()` para que:\n    - `h1` vaya de 1.8rem (móvil) a 3rem (desktop).\n    - `h2` de 1.4rem a 2.25rem.\n    - `p` quede en 1rem fijo pero con `max-width: 65ch`.\n    - Line-height: 1.2 para headings, 1.6 para párrafos.\n\n## Sección E — Selectores avanzados\n\n15. Escribí el selector CSS correcto para cada situación:\n    - Todos los `<input>` inválidos que no estén vacíos.\n    - El primer `<li>` de cada `<ul>`.\n    - Los pares (2°, 4°, 6°...) de una lista.\n    - Cualquier `<a>` que abra un PDF (`href` que termina en `.pdf`).\n    - Un `<h2>` que tenga un `<img>` como hijo directo.\n    - Cualquier enlace externo (que empiece con `http`).\n\n## Desafío\n\n16. **Reimplementá el botón de \"like\" de Twitter** (solo CSS, sin JS): un corazón que al hover crece suavemente, y al click (via `:active` o mediante un `<input type=\"checkbox\">` hackeado) se pone rojo con un pulso de animación. Usá `@keyframes`.\n\n17. **CSS-only dropdown**: menú desplegable que aparece al hacer hover (o focus, por a11y) en un botón — sin JavaScript. Usá el combinador `+` o `~` con `:focus-within`.\n\n## Entregable\n\nCreá una carpeta `ps3/` con los archivos `tarjeta.html`, `tipografia.html`, `like.html`, `dropdown.html`. Subilos a GitHub.\n"</script>
  <script src="../../assets/vendor/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
