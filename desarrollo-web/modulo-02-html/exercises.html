<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicios PS2 — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../../index.html">← Portal</a>
      <div class="right">
        <a href="../../lectures.html#m2">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set 2 — HTML semántico\n\n## Sección A — Refactor\n\n1. Tomá este HTML \"antiguo\" y reescribilo con **etiquetas semánticas HTML5** correctas:\n\n```html\n<div class=\"header\">\n  <div class=\"logo\">Mi Tienda</div>\n  <div class=\"nav\">\n    <div><a href=\"/\">Inicio</a></div>\n    <div><a href=\"/productos\">Productos</a></div>\n  </div>\n</div>\n<div class=\"content\">\n  <div class=\"post\">\n    <div class=\"title\">Nuevo producto</div>\n    <div class=\"date\">20/04/2026</div>\n    <div class=\"body\">Lorem ipsum...</div>\n  </div>\n  <div class=\"sidebar\">Ofertas del día</div>\n</div>\n<div class=\"footer\">© 2026</div>\n```\n\nReglas: cero `<div>` si se puede evitar, headings correctos, `<time>` con `datetime`.\n\n## Sección B — Validación de accesibilidad\n\n2. Detectá los **6 errores** de accesibilidad en este fragmento y corregilos:\n\n```html\n<html>\n<head><title></title></head>\n<body>\n  <h1>Bienvenido</h1>\n  <h4>Sobre nosotros</h4>\n  <img src=\"team.jpg\">\n  <div onclick=\"alert('hola')\">Cliqueame</div>\n  <input type=\"text\" placeholder=\"Tu nombre\">\n  <a href=\"javascript:void(0)\" onclick=\"borrar()\">Borrar</a>\n</body>\n</html>\n```\n\n## Sección C — Construcción\n\n3. **Construí una página de currículum** (`cv.html`) usando solo HTML semántico (sin CSS propio). Debe tener:\n   - `<header>` con tu nombre (`<h1>`), puesto y foto con `alt` descriptivo.\n   - `<nav>` con enlaces a las secciones internas (`#experiencia`, `#educacion`, `#contacto`).\n   - `<main>` con:\n     - `<section id=\"experiencia\">` con al menos 2 trabajos (usá `<article>` por trabajo, con `<time>` para las fechas).\n     - `<section id=\"educacion\">` con una `<ul>`.\n     - `<section id=\"habilidades\">` con una `<dl>` (término/definición).\n   - `<aside>` con una cita que te inspire (`<blockquote>`).\n   - `<footer>` con tu email (`mailto:`), GitHub y LinkedIn.\n   - Validalo en https://validator.w3.org/#validate_by_input.\n\n4. **Formulario de encuesta** (`encuesta.html`): crea un formulario que pida:\n   - Edad (número, 13-120)\n   - Email (validación nativa)\n   - 3 lenguajes favoritos (checkboxes)\n   - Nivel (radio: principiante/intermedio/avanzado)\n   - Un color favorito (input color)\n   - Un rango de horas de práctica por semana (input range 0-40, mostrando el valor con `<output>`)\n   - Comentario (textarea)\n   - Botón submit a `https://httpbin.org/post`\n\n## Sección D — Inspección\n\n5. Abrí https://github.com. Con DevTools → Elements → contá:\n   - ¿Cuántos elementos `<nav>` hay?\n   - ¿Cuántos `<main>`?\n   - ¿Cuántos `<h1>`?\n   - ¿Qué `lang` declara el `<html>`?\n\n6. Comparalo con https://news.ycombinator.com. ¿Cuál es **menos semántico**? ¿Por qué importa?\n\n## Desafío\n\n7. **Open Graph challenge**: agregá a tu `cv.html` todas las meta tags necesarias para que, si alguien lo comparte por WhatsApp o Twitter, se vea una preview con imagen, título y descripción. Probá en https://metatags.io/.\n\n## Entregable\n\nSubí `cv.html` y `encuesta.html` a un repo de GitHub. Ese es tu primer paso del portfolio.\n"</script>
  <script src="../../assets/vendor/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
