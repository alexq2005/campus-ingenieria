<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario completo — validación nativa HTML5</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 1rem; background: #f8fafc; }
    form { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    label { display: block; margin-top: 1rem; font-weight: 600; color: #334155; }
    input, select, textarea {
      display: block; width: 100%; margin-top: 0.25rem; padding: 0.6rem;
      border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem;
      box-sizing: border-box;
    }
    input:invalid:not(:placeholder-shown) { border-color: #ef4444; }
    input:valid:not(:placeholder-shown) { border-color: #10b981; }
    fieldset { margin-top: 1rem; border: 1px solid #e2e8f0; border-radius: 6px; padding: 1rem; }
    legend { font-weight: 600; padding: 0 0.5rem; }
    .checkbox-line { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-weight: 400; }
    .checkbox-line input { width: auto; margin: 0; }
    button {
      margin-top: 1.5rem; padding: 0.8rem 1.5rem;
      background: #0ea5e9; color: white; border: 0; border-radius: 6px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #0284c7; }
    small { color: #64748b; font-weight: 400; }
  </style>
</head>
<body>

  <h1>Registro</h1>
  <p>Intenta enviar el formulario vacío, con email inválido, con contraseña corta — y fijate cómo el navegador valida <strong>sin una sola línea de JavaScript</strong>.</p>

  <form action="https://httpbin.org/post" method="POST" novalidate-hint="quita novalidate para ver validación nativa">

    <label for="nombre">Nombre completo <small>(obligatorio)</small></label>
    <input type="text" id="nombre" name="nombre" required
           minlength="2" maxlength="80"
           placeholder="Ada Lovelace"
           autocomplete="name">

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required
           placeholder="ada@ejemplo.com"
           autocomplete="email">

    <label for="password">Contraseña <small>(mín. 8 caracteres)</small></label>
    <input type="password" id="password" name="password" required
           minlength="8"
           autocomplete="new-password"
           placeholder="••••••••">

    <label for="edad">Edad</label>
    <input type="number" id="edad" name="edad" min="13" max="120" placeholder="25">

    <label for="nacimiento">Fecha de nacimiento</label>
    <input type="date" id="nacimiento" name="nacimiento">

    <label for="sitio">Sitio web <small>(opcional)</small></label>
    <input type="url" id="sitio" name="sitio" placeholder="https://tusitio.com">

    <label for="tel">Teléfono</label>
    <input type="tel" id="tel" name="tel" pattern="[+0-9\s-]{7,20}" placeholder="+54 9 11 1234 5678">

    <label for="color">Color favorito</label>
    <input type="color" id="color" name="color" value="#0ea5e9">

    <label for="rango">Experiencia (años): <output id="rangoOut">5</output></label>
    <input type="range" id="rango" name="rango" min="0" max="30" value="5"
           oninput="rangoOut.value = this.value">

    <label for="pais">País</label>
    <select id="pais" name="pais" required>
      <option value="">— Elegí —</option>
      <option value="ar">Argentina</option>
      <option value="mx">México</option>
      <option value="es">España</option>
      <option value="cl">Chile</option>
      <option value="co">Colombia</option>
    </select>

    <fieldset>
      <legend>Plan</legend>
      <label class="checkbox-line"><input type="radio" name="plan" value="free" checked> Gratuito</label>
      <label class="checkbox-line"><input type="radio" name="plan" value="pro"> Pro — $9/mes</label>
      <label class="checkbox-line"><input type="radio" name="plan" value="team"> Team — $29/mes</label>
    </fieldset>

    <fieldset>
      <legend>Intereses</legend>
      <label class="checkbox-line"><input type="checkbox" name="intereses" value="html"> HTML</label>
      <label class="checkbox-line"><input type="checkbox" name="intereses" value="css"> CSS</label>
      <label class="checkbox-line"><input type="checkbox" name="intereses" value="js"> JavaScript</label>
      <label class="checkbox-line"><input type="checkbox" name="intereses" value="react"> React</label>
    </fieldset>

    <label for="comentario">Comentarios</label>
    <textarea id="comentario" name="comentario" rows="4"
              placeholder="Contanos algo..." maxlength="500"></textarea>

    <label class="checkbox-line">
      <input type="checkbox" name="terminos" required>
      Acepto los <a href="#">términos y condiciones</a>
    </label>

    <button type="submit">Crear cuenta</button>
  </form>

</body>
</html>
