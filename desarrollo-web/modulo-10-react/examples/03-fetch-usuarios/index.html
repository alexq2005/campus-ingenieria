<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React — fetch con useEffect</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 2rem auto; padding: 1rem; background: #f8fafc; }
    .user { display: flex; gap: 1rem; align-items: center; background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 0.5rem; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #0ea5e9, #8b5cf6); display: grid; place-items: center; color: white; font-weight: bold; flex-shrink: 0; }
    .user h3 { margin: 0; font-size: 1.05rem; }
    .user p  { margin: 0.1rem 0 0; color: #64748b; font-size: 0.9em; }
    .loader { padding: 2rem; text-align: center; color: #64748b; }
    .error { padding: 1rem; background: #fee2e2; color: #991b1b; border-radius: 8px; }
    button { padding: 0.5rem 1rem; background: #0ea5e9; color: white; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .skeleton { background: #e2e8f0; height: 20px; border-radius: 4px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Custom hook: useFetch genérico
    function useFetch(url) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        const ctrl = new AbortController();
        setLoading(true);
        setError(null);

        fetch(url, { signal: ctrl.signal })
          .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
          .then(d => { setData(d); setLoading(false); })
          .catch(e => {
            if (e.name !== 'AbortError') {
              setError(e.message); setLoading(false);
            }
          });

        return () => ctrl.abort();
      }, [url]);

      return { data, loading, error };
    }

    function Avatar({ name }) {
      const initials = name.split(' ').slice(0, 2).map(s => s[0]).join('');
      return <div className="avatar">{initials}</div>;
    }

    function UserCard({ user }) {
      return (
        <div className="user">
          <Avatar name={user.name} />
          <div>
            <h3>{user.name}</h3>
            <p>{user.email} · {user.company.name}</p>
          </div>
        </div>
      );
    }

    function Skeleton() {
      return (
        <div className="user">
          <div className="avatar" style={{background: '#cbd5e1'}}></div>
          <div style={{flex: 1}}>
            <div className="skeleton" style={{width: '60%', marginBottom: '0.3rem'}}></div>
            <div className="skeleton" style={{width: '40%'}}></div>
          </div>
        </div>
      );
    }

    function App() {
      const [refresh, setRefresh] = useState(0);
      const { data, loading, error } = useFetch(
        `https://jsonplaceholder.typicode.com/users?_=${refresh}`
      );

      return (
        <div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'1rem'}}>
            <h1>Usuarios</h1>
            <button onClick={() => setRefresh(n => n + 1)}>Refrescar</button>
          </div>

          {error && <div className="error">Error: {error}</div>}

          {loading && (
            <>
              <Skeleton /><Skeleton /><Skeleton />
            </>
          )}

          {!loading && !error && data && (
            <div>
              {data.map(u => <UserCard key={u.id} user={u} />)}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
