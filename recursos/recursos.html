<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca curada — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e1a;
      --surface: #1e293b;
      --surface-2: #283649;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #34d399;
      --gold: #fbbf24;
    }

    body {
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(circle at 0% 0%, rgba(52, 211, 153, 0.05), transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(251, 191, 36, 0.05), transparent 50%),
        var(--bg);
      color: var(--text); line-height: 1.55;
      min-height: 100vh; padding: 2rem 1.5rem;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }

    a { color: var(--accent); text-decoration: none; transition: color 0.15s; }
    a:hover { text-decoration: underline; }

    .back { display: inline-flex; gap: 0.4rem; color: var(--muted); font-size: 0.9em; margin-bottom: 1.5rem; }

    h1 {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }
    .lede { color: var(--muted); margin-bottom: 1.5rem; }

    /* ───── Search + filters ───── */
    .toolbar {
      position: sticky; top: 0;
      background: var(--bg);
      padding: 0.5rem 0 1rem;
      z-index: 10;
      backdrop-filter: blur(10px);
    }
    .search-input {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 1rem;
      margin-bottom: 0.6rem;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }

    .filters {
      display: flex; flex-wrap: wrap; gap: 0.35rem;
    }
    .filter-btn {
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.8em;
      font-weight: 600;
    }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    /* ───── Section ───── */
    .section {
      margin-bottom: 2rem;
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.2rem;
      margin-bottom: 0.8rem;
      color: var(--gold);
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .section-title .count {
      font-size: 0.7em;
      color: var(--muted);
      font-weight: normal;
      font-family: monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.7rem;
    }

    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      display: block;
      text-decoration: none;
      transition: all 0.15s;
    }
    .item:hover {
      border-left-color: var(--gold);
      transform: translateY(-2px);
      text-decoration: none;
    }
    .item-name {
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.15rem;
    }
    .item-desc {
      font-size: 0.85em;
      color: var(--muted);
    }
    .item-tags {
      margin-top: 0.4rem;
      display: flex; gap: 0.25rem; flex-wrap: wrap;
    }
    .item-tag {
      font-size: 0.7em;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .item-tag.free { background: rgba(52, 211, 153, 0.15); color: var(--accent); }
    .item-tag.paid { background: rgba(251, 191, 36, 0.15); color: var(--gold); }
    .item-tag.es   { background: rgba(244, 114, 182, 0.15); color: #f472b6; }
    .item-tag.must { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }

    .empty {
      text-align: center; padding: 3rem 1rem;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    .item.hidden, .section.hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="../index.html" class="back">← Volver al curso</a>
    <h1>📚 Biblioteca curada</h1>
    <p class="lede">200+ recursos seleccionados: libros, docs, blogs, canales, herramientas. Buscá o filtrá por categoría.</p>

    <div class="toolbar">
      <input type="search" id="search" class="search-input" placeholder="Buscar recurso..." autocomplete="off">
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">Todo</button>
        <button class="filter-btn" data-filter="libros">📖 Libros</button>
        <button class="filter-btn" data-filter="docs">🌐 Docs</button>
        <button class="filter-btn" data-filter="blogs">✍️ Blogs</button>
        <button class="filter-btn" data-filter="videos">🎥 YouTube</button>
        <button class="filter-btn" data-filter="cursos">🎓 Cursos</button>
        <button class="filter-btn" data-filter="herramientas">🛠 Herramientas</button>
        <button class="filter-btn" data-filter="apis">🔌 APIs</button>
        <button class="filter-btn" data-filter="hosting">☁️ Hosting</button>
        <button class="filter-btn" data-filter="comunidades">🗣 Comunidades</button>
      </div>
    </div>

    <div id="content"></div>
  </div>

  <script>

        { name: "Don't Make Me Think", url: '#', desc: 'Steve Krug. UX clásico.', tags: ['paid'] },
        { name: 'Refactoring UI', url: 'https://www.refactoringui.com', desc: 'Adam Wathan & Steve Schoger. UI design para developers.', tags: ['paid'] },
        { name: 'Designing Data-Intensive Applications', url: '#', desc: 'Martin Kleppmann. Para architects.', tags: ['paid'] },

    {

        { name: 'MDN Web Docs', url: 'https://developer.mozilla.org', desc: 'La biblia absoluta de HTML/CSS/JS.', tags: ['free', 'must'] },
        { name: 'web.dev', url: 'https://web.dev', desc: "Google's guías de best practices.", tags: ['free'] },
        { name: 'React docs', url: 'https://react.dev', desc: 'Docs modernas de React 19.', tags: ['free', 'must'] },
        { name: 'TypeScript handbook', url: 'https://www.typescriptlang.org/docs/', desc: 'TS oficial.', tags: ['free'] },
        { name: 'Vite', url: 'https://vitejs.dev', desc: 'Build tool moderno.', tags: ['free'] },
        { name: 'WHATWG HTML Spec', url: 'https://html.spec.whatwg.org', desc: 'La fuente de la verdad de HTML.', tags: ['free'] },
        { name: 'ECMAScript Spec', url: 'https://tc39.es/ecma262/', desc: 'La spec de JS.', tags: ['free'] },

        { name: 'Kent C. Dodds', url: 'https://kentcdodds.com', desc: 'React + testing.', tags: ['free'] },
        { name: 'Overreacted (Dan Abramov)', url: 'https://overreacted.io', desc: 'React, mental models.', tags: ['free'] },
        { name: 'Lea Verou', url: 'https://lea.verou.me', desc: 'CSS profundo.', tags: ['free'] },
        { name: 'Sara Soueidan', url: 'https://www.sarasoueidan.com', desc: 'A11y + SVG.', tags: ['free'] },
        { name: 'Inclusive Components', url: 'https://inclusive-components.design', desc: 'Heydon Pickering. Componentes accesibles.', tags: ['free'] },
        { name: 'Matt Pocock', url: 'https://www.totaltypescript.com', desc: 'TypeScript guru.', tags: ['free'] },
      ]
    },

    {

      items: [
        { name: 'Fireship', url: 'https://www.youtube.com/@Fireship', desc: 'Shorts de 100s, denso, divertido.', tags: ['free', 'must'] },
        { name: 'Kevin Powell', url: 'https://www.youtube.com/@KevinPowell', desc: 'El maestro de CSS.', tags: ['free', 'must'] },
        { name: 'Web Dev Simplified', url: 'https://www.youtube.com/@WebDevSimplified', desc: 'Tutoriales limpios y completos.', tags: ['free'] },
        { name: 'Josh tried coding', url: 'https://www.youtube.com/@JoshtriedCoding', desc: 'Frontend moderno.', tags: ['free'] },
        { name: 'Jack Herrington', url: 'https://www.youtube.com/@JackHerrington', desc: 'React + patrones avanzados.', tags: ['free'] },
        { name: 'Matt Pocock', url: 'https://www.youtube.com/@mattpocockuk', desc: 'TypeScript, el dios.', tags: ['free', 'must'] },
        { name: 'midudev', url: 'https://www.youtube.com/@midulive', desc: 'El mejor en español.', tags: ['free', 'es'] },
        { name: 'Chrome for Developers', url: 'https://www.youtube.com/@ChromeforDevelopers', desc: 'Oficial de Google.', tags: ['free'] },
        { name: 'Theo - t3.gg', url: 'https://www.youtube.com/@t3dotgg', desc: 'Opiniones fuertes, actualidad.', tags: ['free'] },
        { name: 'CS50 Harvard', url: 'https://www.youtube.com/@cs50', desc: 'El curso original.', tags: ['free'] },
      ]
    },

    {
      key: 'cursos', title: '🎓 Cursos online',
      items: [
        { name: 'CS50 (Harvard)', url: 'https://cs50.harvard.edu', desc: 'CS general.', tags: ['free', 'must'] },
        { name: 'CS50W', url: 'https://cs50.harvard.edu/web/', desc: 'Web con Django + React.', tags: ['free'] },
        { name: 'freeCodeCamp', url: 'https://www.freecodecamp.org', desc: 'Curriculums interactivos.', tags: ['free'] },
        { name: 'The Odin Project', url: 'https://www.theodinproject.com', desc: 'Curso full-stack gratis.', tags: ['free'] },
        { name: 'JavaScript30', url: 'https://javascript30.com', desc: 'Wes Bos. 30 proyectos JS vanilla.', tags: ['free'] },
        { name: 'Frontend Masters', url: 'https://frontendmasters.com', desc: 'Workshops profundos.', tags: ['paid'] },
        { name: 'Epic React', url: 'https://www.epicreact.dev', desc: 'Kent C. Dodds.', tags: ['paid'] },
        { name: 'CSS for JS Developers', url: 'https://css-for-js.dev', desc: 'Josh Comeau.', tags: ['paid'] },
      ]
    },

    {
      key: 'herramientas', title: '🛠 Herramientas',
      items: [
        { name: 'VS Code', url: 'https://code.visualstudio.com', desc: 'El editor estándar.', tags: ['free', 'must'] },
        { name: 'Figma', url: 'https://figma.com', desc: 'Diseño colaborativo.', tags: ['free'] },
        { name: 'Excalidraw', url: 'https://excalidraw.com', desc: 'Wireframes rápidos.', tags: ['free'] },
        { name: 'Coolors', url: 'https://coolors.co', desc: 'Generador de paletas.', tags: ['free'] },
        { name: 'Squoosh', url: 'https://squoosh.app', desc: 'Compresión de imágenes.', tags: ['free'] },
        { name: 'Lucide Icons', url: 'https://lucide.dev', desc: 'Iconos open source.', tags: ['free'] },
        { name: 'Heroicons', url: 'https://heroicons.com', desc: 'Iconos del equipo Tailwind.', tags: ['free'] },
        { name: 'Unsplash', url: 'https://unsplash.com', desc: 'Fotos gratis.', tags: ['free'] },
        { name: 'Undraw', url: 'https://undraw.co', desc: 'Ilustraciones gratuitas.', tags: ['free'] },
        { name: 'Bundlephobia', url: 'https://bundlephobia.com', desc: 'Peso de paquetes npm.', tags: ['free', 'must'] },
        { name: 'Regex101', url: 'https://regex101.com', desc: 'Tester de regex.', tags: ['free'] },
        { name: 'Lighthouse', url: 'https://pagespeed.web.dev', desc: 'Audit de performance.', tags: ['free', 'must'] },
        { name: 'WAVE', url: 'https://wave.webaim.org', desc: 'Audit a11y online.', tags: ['free'] },
        { name: 'Contrast Checker', url: 'https://webaim.org/resources/contrastchecker/', desc: 'WCAG contrast.', tags: ['free'] },
        { name: 'Meta Tags Preview', url: 'https://metatags.io', desc: 'Preview de Open Graph.', tags: ['free'] },
        { name: 'CodeSandbox', url: 'https://codesandbox.io', desc: 'Playground online.', tags: ['free'] },
        { name: 'StackBlitz', url: 'https://stackblitz.com', desc: 'IDE web full Node/Vite.', tags: ['free'] },
      ]
    },

    {
      key: 'apis', title: '🔌 APIs públicas para practicar',
      items: [
        { name: 'JSONPlaceholder', url: 'https://jsonplaceholder.typicode.com', desc: 'Fake API para fetch + CRUD.', tags: ['free', 'must'] },
        { name: 'PokéAPI', url: 'https://pokeapi.co', desc: 'Datos de pokémon, sin auth.', tags: ['free'] },
        { name: 'OpenLibrary', url: 'https://openlibrary.org/developers/api', desc: 'Libros + ISBN + portadas.', tags: ['free'] },
        { name: 'TMDB', url: 'https://www.themoviedb.org/documentation/api', desc: 'Películas, series. Requiere key.', tags: ['free'] },
        { name: 'Open-Meteo', url: 'https://open-meteo.com', desc: 'Clima sin API key.', tags: ['free'] },
        { name: 'httpbin.org', url: 'https://httpbin.org', desc: 'Endpoints de testing HTTP.', tags: ['free'] },
        { name: 'Picsum', url: 'https://picsum.photos', desc: 'Imágenes random para placeholders.', tags: ['free'] },

        { name: 'Pexels API', url: 'https://www.pexels.com/api/', desc: 'Fotos profesionales gratuitas.', tags: ['free'] },
      ]
    },

    {

      items: [

        { name: 'Netlify', url: 'https://netlify.com', desc: 'Excelente DX, gran free tier.', tags: ['free'] },

        { name: 'Railway', url: 'https://railway.app', desc: 'Si necesitás backend.', tags: ['paid'] },
        { name: 'Render', url: 'https://render.com', desc: 'Backend hosting moderno.', tags: ['free'] },
      ]
    },

    {
      key: 'comunidades', title: '🗣 Comunidades',
      items: [
        { name: 'Dev.to', url: 'https://dev.to', desc: 'Blogs técnicos comunitarios.', tags: ['free'] },
        { name: 'Hacker News', url: 'https://news.ycombinator.com', desc: 'Tendencias y debate técnico.', tags: ['free'] },
        { name: 'r/reactjs', url: 'https://reddit.com/r/reactjs', desc: 'Reddit React.', tags: ['free'] },
        { name: 'r/webdev', url: 'https://reddit.com/r/webdev', desc: 'Reddit Web Dev.', tags: ['free'] },
        { name: 'Reactiflux', url: 'https://www.reactiflux.com', desc: 'Discord de React.', tags: ['free'] },
        { name: 'Stack Overflow', url: 'https://stackoverflow.com', desc: 'Q&A clásico.', tags: ['free'] },
      ]
    },

    {
      key: 'otros', title: '📈 Mantenerse al día',
      items: [
        { name: 'State of JS', url: 'https://stateofjs.com', desc: 'Encuesta anual del ecosistema JS.', tags: ['free', 'must'] },
        { name: 'State of CSS', url: 'https://stateofcss.com', desc: 'Encuesta anual de CSS.', tags: ['free'] },
        { name: 'JavaScript Weekly', url: 'https://javascriptweekly.com', desc: 'Newsletter semanal.', tags: ['free'] },
        { name: 'CSS Weekly', url: 'https://css-weekly.com', desc: 'Newsletter CSS.', tags: ['free'] },
        { name: 'Frontend Focus', url: 'https://frontendfoc.us', desc: 'Newsletter frontend general.', tags: ['free'] },
        { name: 'TypeScript Weekly', url: 'https://www.typescript-weekly.com', desc: 'Newsletter TS.', tags: ['free'] },
        { name: 'Syntax.fm', url: 'https://syntax.fm', desc: 'Podcast Wes Bos + Scott Tolinski.', tags: ['free'] },
        { name: 'Chrome for Developers Blog', url: 'https://developer.chrome.com/blog/', desc: 'Novedades del browser.', tags: ['free'] },
      ]
    },
  ];

  // ═════════════════════════════
  // Render
  // ═════════════════════════════
  function render() {
    const root = document.getElementById('content');
    root.innerHTML = SECTIONS.map(s => `
      <section class="section" data-key="${s.key}">
        <h2 class="section-title">
          ${s.title}
          <span class="count">${s.items.length} items</span>
        </h2>
        <div class="grid">
          ${s.items.map(it => `
            <a class="item" href="${it.url}" target="_blank" rel="noopener noreferrer"
               data-name="${it.name.toLowerCase()}" data-desc="${it.desc.toLowerCase()}">
              <div class="item-name">${escape(it.name)}</div>
              <div class="item-desc">${escape(it.desc)}</div>
              <div class="item-tags">
                ${(it.tags || []).map(t => `<span class="item-tag ${t}">${tagLabel(t)}</span>`).join('')}
              </div>
            </a>
          `).join('')}
        </div>
      </section>
    `).join('');
  }

  function tagLabel(t) {
    return ({ free: 'GRATIS', paid: 'PAGO', es: 'ES', must: '★ TOP' }[t] || t.toUpperCase());
  }
  function escape(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ═════════════════════════════
  // Filter + search
  // ═════════════════════════════
  let activeFilter = 'all';
  let activeQuery = '';

  function applyFilters() {
    const sections = document.querySelectorAll('.section');
    sections.forEach(section => {
      const matchesCat = activeFilter === 'all' || section.dataset.key === activeFilter;
      let visibleItems = 0;
      section.querySelectorAll('.item').forEach(item => {
        const matchesText = !activeQuery
          || item.dataset.name.includes(activeQuery)
          || item.dataset.desc.includes(activeQuery);
        const show = matchesCat && matchesText;
        item.classList.toggle('hidden', !show);
        if (show) visibleItems++;
      });
      section.classList.toggle('hidden', visibleItems === 0);
    });
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      applyFilters();
    });
  });

  document.getElementById('search').addEventListener('input', (e) => {
    activeQuery = e.target.value.trim().toLowerCase();
    applyFilters();
  });

  render();
  </script>
</body>
</html>
