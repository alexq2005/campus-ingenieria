<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glosario — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e1a;
      --surface: #1e293b;
      --surface-2: #283649;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #06b6d4;
      --accent-2: #8b5cf6;
      --gold: #fbbf24;
    }

    body {
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(circle at 0% 0%, rgba(6,182,212,0.06), transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(139,92,246,0.06), transparent 50%),
        var(--bg);
      color: var(--text); line-height: 1.6; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .back { display: inline-flex; gap: 0.4rem; color: var(--muted); font-size: 0.9em; margin-bottom: 1.5rem; }
    .back:hover { color: var(--accent); }

    h1 {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }
    .lede { color: var(--muted); margin-bottom: 1.5rem; }

    /* ───── Search bar (sticky) ───── */
    .search-bar {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 0.5rem 0 1rem;
      z-index: 10;
      backdrop-filter: blur(10px);
    }
    .search-input {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1rem 0.9rem 2.6rem;
      font-size: 1.05rem;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      outline: none; border-color: var(--accent);
    }
    .search-icon {
      position: absolute;
      top: 50%; left: 1rem;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1.1rem;
      pointer-events: none;
    }
    .search-wrapper { position: relative; }

    .stats-row {
      display: flex; justify-content: space-between;
      font-size: 0.85em; color: var(--muted);
      margin-top: 0.6rem;
    }
    .clear-btn {
      background: none; border: 0; color: var(--accent);
      cursor: pointer; font-size: 0.85em;
    }
    .clear-btn:hover { text-decoration: underline; }

    /* ───── Letter nav (jump A-Z) ───── */
    .letter-nav {
      display: flex; flex-wrap: wrap; gap: 0.25rem;
      margin: 1rem 0 2rem;
      padding: 0.6rem;
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .letter-nav a {
      display: grid; place-items: center;
      width: 30px; height: 30px;
      background: var(--surface-2);
      border-radius: 5px;
      font-weight: 700;
      font-family: monospace;
      font-size: 0.9em;
      color: var(--muted);
      text-decoration: none;
      transition: all 0.15s;
    }
    .letter-nav a:hover, .letter-nav a.has-content {
      color: var(--text);
      background: var(--accent);
      color: var(--bg);
    }
    .letter-nav a.empty { opacity: 0.3; pointer-events: none; }

    /* ───── Letter sections ───── */
    .letter-section {
      margin-bottom: 2rem;
      scroll-margin-top: 100px;
    }
    .letter-heading {
      font-size: 2rem;
      color: var(--gold);
      font-family: monospace;
      font-weight: 900;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid var(--border);
      margin-bottom: 1rem;
      display: flex; align-items: baseline; gap: 0.7rem;
    }
    .letter-heading-count {
      font-size: 0.7em;
      color: var(--muted);
      font-weight: normal;
      font-family: system-ui, sans-serif;
    }

    /* ───── Term card ───── */
    .term {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 0.9rem 1.1rem;
      margin-bottom: 0.5rem;
      transition: transform 0.1s, border-color 0.15s;
    }
    .term:hover {
      border-left-color: var(--gold);
      transform: translateX(3px);
    }
    .term-name {
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.2rem;
      font-size: 1.05rem;
    }
    .term-name code {
      background: var(--surface-2);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.92em;
    }
    .term-def {
      font-size: 0.95em;
      color: var(--text);
    }
    .term-def code {
      background: var(--surface-2);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 0.88em;
      color: var(--gold);
      font-family: 'JetBrains Mono', monospace;
    }
    .term-def em {
      color: var(--accent-2);
      font-style: normal;
      font-weight: 600;
    }

    /* Highlighted match */
    .term mark {
      background: rgba(251, 191, 36, 0.3);
      color: var(--gold);
      padding: 0 2px;
      border-radius: 2px;
    }

    .term.hidden { display: none; }

    .empty-state {
      text-align: center; padding: 4rem 1rem;
      color: var(--muted);
    }
    .empty-state .emoji { font-size: 3rem; margin-bottom: 1rem; }

    /* Keyboard shortcut hint */
    .kbd {
      display: inline-block;
      background: var(--surface-2);
      padding: 1px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 0.82em;
      border: 1px solid var(--border);
      box-shadow: 0 1px 0 var(--border);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="../index.html" class="back">← Volver al curso</a>
    <h1>📖 Glosario</h1>
    <p class="lede">100+ términos del curso, con búsqueda en vivo. Atajo: <span class="kbd">/</span> para enfocar el buscador.</p>

    <div class="search-bar">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="search" id="search" class="search-input" placeholder="Buscar término o definición..." autocomplete="off">
      </div>
      <div class="stats-row">
        <span id="resultsCount">— términos —</span>
        <button id="clearBtn" class="clear-btn" style="display:none;">✕ Limpiar</button>
      </div>
    </div>

    <nav class="letter-nav" id="letterNav" aria-label="Saltar a letra"></nav>

    <div id="content"></div>

    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="emoji">🔍</div>
      <p>Sin resultados para esa búsqueda.</p>
    </div>
  </div>

  <script>
  // ═════════════════════════════════════════════════════
  // Datos del glosario — todos los términos
  // ═════════════════════════════════════════════════════
  const TERMS = [
    // A
    ['A11y', 'Abreviatura de "accessibility" (hay 11 letras entre la "a" y la "y"). Conjunto de prácticas para que <em>todos</em> puedan usar tu app.'],
    ['ABI', 'Application Binary Interface. Poco relevante en frontend, salvo cuando integrás WebAssembly.'],
    ['Absolute positioning', '<code>position: absolute</code>. Saca al elemento del flujo; se posiciona relativo al ancestro posicionado más cercano.'],
    ['Ajax', '<em>Asynchronous JavaScript and XML</em>. Término de los 2000s para "el cliente hace requests sin recargar". Hoy se hace con fetch; el nombre quedó.'],
    ['API', 'Application Programming Interface. Contrato entre dos piezas de software. En web, usualmente endpoints HTTP JSON.'],
    ['Arrow function', '<code>() => {}</code>. Sintaxis corta y <code>this</code> heredado del scope exterior.'],
    ['Async/await', 'Azúcar sintáctico sobre Promises. Permite escribir código asíncrono que se lee como sincrónico.'],
    ['Atomic commits', 'Commits de Git que representan un cambio único y coherente.'],
    ['Axe', 'Librería/extensión para auditar accesibilidad automáticamente.'],

    // B
    ['Babel', 'Compilador JS → JS. Convierte código moderno (ES2024) a versiones viejas para soportar navegadores antiguos.'],
    ['Bucle de eventos (event loop)', 'Mecanismo por el cual JavaScript (single-threaded) procesa callbacks asincrónicos sin bloquear.'],
    ['Bundler', 'Junta muchos archivos JS/CSS/assets en pocos bundles optimizados. Vite, Webpack, Rollup, esbuild.'],
    ['Box model', 'Modelo que describe cada elemento como: <em>content + padding + border + margin</em>.'],

    // C
    ['Cache busting', 'Cambiar el nombre del archivo (<code>main-abc123.js</code>) para forzar al navegador a descargarlo de nuevo.'],
    ['Cascada (cascade)', 'El algoritmo de CSS que resuelve conflictos: <em>origen > especificidad > orden</em>.'],
    ['CDN', 'Content Delivery Network. Servidores distribuidos que sirven assets rápido. Cloudflare, Fastly.'],
    ['CI/CD', 'Continuous Integration / Continuous Deployment. Pipeline que testea y despliega cada cambio.'],
    ['CLS', 'Cumulative Layout Shift. Core Web Vital: cuánto "salta" tu página. Objetivo: ≤ 0.1.'],
    ['Client-side rendering (CSR)', 'El HTML se construye en el navegador con JS. React "normal" hace esto.'],
    ['Closure', 'Función que recuerda las variables del scope donde fue creada, aún después de que ese scope termine.'],
    ['Code splitting', 'Dividir el bundle en chunks que se cargan solo cuando se necesitan. <code>React.lazy</code>.'],
    ['Component', 'Pieza reutilizable de UI. En React, función que retorna JSX.'],
    ['CommonJS', 'Sistema de módulos viejo de Node (<code>require</code>/<code>module.exports</code>). Reemplazado por ES Modules.'],
    ['Content-Security-Policy (CSP)', 'Header HTTP que controla qué recursos puede cargar el navegador. Defensa contra XSS.'],
    ['Controlled component', 'En React, un input cuyo valor está en el state de React, no en el DOM.'],
    ['Cookie', 'Datos guardados por el servidor en el navegador. Se envían automáticamente en cada request.'],
    ['CORS', 'Cross-Origin Resource Sharing. El navegador bloquea requests entre dominios salvo que el servidor lo permita.'],
    ['CRUD', 'Create, Read, Update, Delete. Las 4 operaciones básicas de datos.'],
    ['CSS-in-JS', 'Escribir CSS dentro de JS. Emotion, styled-components. En 2026 pierde terreno frente a Tailwind.'],
    ['Custom hook', 'En React, función cuyo nombre empieza con <code>use</code> y reutiliza lógica entre componentes.'],

    // D
    ['Debouncing', 'Demorar una función hasta que pare de dispararse. Esperar que el usuario termine de tipear.'],
    ['Declarative', '"Describís el QUÉ, no el CÓMO". React es declarativo; jQuery era imperativo.'],
    ['Deferred script', '<code>&lt;script defer&gt;</code> — descarga en paralelo, ejecuta después del HTML.'],
    ['Dependency array', 'En <code>useEffect(fn, [dep1, dep2])</code>, el array que define cuándo re-ejecutar el efecto.'],
    ['DevTools', 'Herramientas de desarrollo del navegador (F12). Tu microscopio.'],
    ['DNS', 'Domain Name System. Convierte nombres (<code>google.com</code>) en IPs (<code>142.250.190.14</code>).'],
    ['DOM', 'Document Object Model. Árbol vivo de objetos que representa el HTML.'],
    ['DX', 'Developer Experience. Qué tan bueno es programar con una herramienta.'],

    // E
    ['ECMAScript', 'El estándar oficial de JavaScript. ES6 = ES2015 fue la revisión más importante.'],
    ['Event bubbling', 'Fase de propagación del target hacia arriba (document).'],
    ['Event capture', 'Fase de propagación del document hacia el target.'],
    ['Event delegation', 'Patrón: un solo listener en un padre en vez de N en cada hijo.'],
    ['Exports / imports', 'Sintaxis de ES Modules para compartir código entre archivos.'],

    // F
    ['FCP', 'First Contentful Paint. Cuándo se pinta el primer contenido (texto, imagen).'],
    ['Fetch API', 'API moderna del navegador para hacer requests HTTP. Devuelve Promise.'],
    ['FID', 'First Input Delay. Web Vital antiguo (reemplazado por INP en 2024).'],
    ['Flexbox', '<code>display: flex</code>. Layout unidimensional.'],
    ['FOUC', 'Flash of Unstyled Content. Cuando el HTML se muestra antes de que cargue el CSS.'],
    ['Fragment (React)', '<code>&lt;&gt;...&lt;/&gt;</code>. Permite devolver múltiples elementos sin un wrapper extra.'],
    ['Framework vs Library', 'Framework impone estructura ("llámame"); librería se usa ("yo te llamo"). React es librería.'],

    // G
    ['Generics (TypeScript)', 'Tipos parametrizados, como funciones de tipos. <code>Array&lt;T&gt;</code>, <code>Promise&lt;T&gt;</code>.'],
    ['Git', 'Sistema de control de versiones.'],
    ['Grid', '<code>display: grid</code>. Layout bidimensional.'],

    // H
    ['Hoisting', 'Comportamiento de JS de "mover" declaraciones al tope del scope. <code>var</code> se hoistea, <code>let</code>/<code>const</code> no.'],
    ['HMR', 'Hot Module Replacement. Reemplazar código en el navegador sin recargar la página.'],
    ['HTTP/HTTPS', 'Protocolo de la Web. HTTPS es HTTP cifrado con TLS.'],
    ['Hydration', 'Cuando HTML pre-renderizado (SSR) se "activa" al ejecutar JS en el cliente.'],

    // I
    ['Idempotente', 'Operación que ejecutada N veces produce el mismo resultado que 1 vez. <code>GET</code> sí, <code>POST</code> no.'],
    ['Immutability', 'No mutar datos; crear copias nuevas. Base de React, Redux, Immer.'],
    ['INP', 'Interaction to Next Paint. Web Vital: tiempo desde interacción hasta el siguiente frame. ≤ 200ms.'],
    ['Intersection Observer', 'API del navegador para detectar cuándo un elemento entra/sale del viewport. Base de lazy loading.'],
    ['ISR', 'Incremental Static Regeneration. Feature de Next.js: regenera páginas estáticas en background.'],

    // J
    ['JSON', 'JavaScript Object Notation. Formato de datos. Derivado de JS pero hoy universal.'],
    ['JSX', 'HTML-like adentro de JS. Se compila a <code>React.createElement()</code>.'],
    ['JWT', 'JSON Web Token. Token firmado para auth. Payload en base64.'],

    // L
    ['LCP', 'Largest Contentful Paint. Core Web Vital: cuándo aparece el elemento más grande. ≤ 2.5s.'],
    ['Lazy loading', 'Cargar recursos solo cuando se necesitan. <code>loading="lazy"</code> en imágenes.'],
    ['Linter', 'Herramienta que detecta errores y anti-patrones. ESLint.'],
    ['localStorage', 'Storage del navegador que persiste entre sesiones. ~5 MB.'],
    ['LTS', 'Long Term Support. Versión de Node.js con soporte extendido (2.5 años).'],

    // M
    ['Memoization', 'Cachear resultados de una función. <code>useMemo</code>, <code>useCallback</code> en React.'],
    ['Middleware', 'Función que procesa un request antes de llegar a su handler final.'],
    ['Minification', 'Comprimir código sacando espacios, acortando variables.'],
    ['Module (ES)', 'Archivo JS con <code>import</code>/<code>export</code>. Scope propio, strict mode automático.'],
    ['Monorepo', 'Múltiples paquetes en un solo repo (pnpm workspaces, Nx, Turborepo).'],

    // N
    ['Node.js', 'Runtime de JavaScript fuera del navegador. Basado en V8.'],
    ['npm', 'Node Package Manager. También el registry público.'],
    ['npx', 'Ejecuta un paquete npm sin instalarlo global.'],
    ['Null vs undefined', '<code>null</code> es "valor intencional vacío"; <code>undefined</code> es "nunca asignado".'],

    // O
    ['OAuth', 'Protocolo de autorización estándar ("Login con Google").'],
    ['Optional chaining', '<code>user?.name?.first</code> — si algo es null/undefined, devuelve undefined sin explotar.'],
    ['Origin', '<code>protocolo://dominio:puerto</code>. Base de same-origin policy.'],

    // P
    ['Package.json', 'Manifiesto del proyecto Node. Dependencias, scripts, metadata.'],
    ['Polyfill', 'Código que agrega una feature moderna a navegadores viejos.'],
    ['Prefetch / Preconnect / Preload', 'Hints al navegador para adelantar carga de recursos.'],
    ['Prettier', 'Formateador de código. Decide por vos, termina discusiones.'],
    ['Primitive (JS)', 'Valores inmutables: string, number, boolean, null, undefined, symbol, bigint.'],
    ['Progressive enhancement', 'Construir para lo básico que funcione en todos lados, luego mejorar.'],
    ['Promise', 'Objeto que representa un valor futuro. Estados: pending, fulfilled, rejected.'],
    ['Prop drilling', 'Pasar props a través de muchos niveles. Síntoma de necesitar Context o state management.'],
    ['Props (React)', 'Argumentos de un componente.'],
    ['Prototype', 'Mecanismo de herencia de JS. Las clases son azúcar sobre esto.'],
    ['PWA', 'Progressive Web App. Funciona offline, se instala como app nativa.'],

    // Q
    ['Query parameters', 'Parte después de <code>?</code> en una URL: <code>/buscar?q=react&page=2</code>.'],

    // R
    ['React', 'Librería de UI. Componentes + estado reactivo.'],
    ['Reducer', 'Función <code>(state, action) => newState</code>. Base de Redux y <code>useReducer</code>.'],
    ['Reflow', 'Sinónimo de Layout.'],
    ['Responsive design', 'Sitio que se adapta a distintos tamaños de pantalla.'],
    ['REST', 'Estilo de API basado en HTTP + recursos + verbos. Alternativa a RPC, GraphQL.'],
    ['Root (HTML/CSS)', '<code>&lt;html&gt;</code>. Las variables <code>:root</code> se definen en él.'],

    // S
    ['SemVer (Semantic Versioning)', '<code>MAJOR.MINOR.PATCH</code>.'],
    ['Selector (CSS)', 'Expresión que apunta a elementos HTML.'],
    ['SEO', 'Search Engine Optimization. Que Google te encuentre y muestre bien.'],
    ['Service Worker', 'Script que corre en background. Habilita PWAs, offline, push.'],
    ['Shadow DOM', 'DOM encapsulado. Base de Web Components.'],
    ['SPA', 'Single Page Application. Carga un HTML y navega via JS. React clásico.'],
    ['SSR', 'Server-Side Rendering. El HTML se renderiza en el servidor. Next.js, Remix.'],
    ['SSG', 'Static Site Generation. El HTML se pre-genera en build time. Ideal para blogs.'],
    ['Strict mode (JS)', '<code>\'use strict\'</code>. Hace que errores silenciosos exploten.'],
    ['Symbol', 'Tipo primitivo único. Útil para IDs privados.'],

    // T
    ['Tailwind', 'Framework CSS utility-first. <code>class="flex gap-4 p-2"</code>.'],
    ['TanStack Query', 'Librería para server state en React (antes "React Query").'],
    ['Template literal', '<code>`Hola ${nombre}`</code>.'],
    ['Throttling', 'Limitar la frecuencia con que se ejecuta una función (ej: 1 vez por segundo).'],
    ['TLS', 'Protocolo de cifrado. TLS 1.3 es el actual.'],
    ['Transpiler', 'Compilador de un lenguaje a otro al mismo nivel (JS → JS, TS → JS).'],
    ['TypeScript', 'JavaScript con tipos estáticos.'],

    // U
    ['UI / UX', 'User Interface / User Experience.'],
    ['Unicode', 'Estándar universal de caracteres. UTF-8 es una codificación de Unicode.'],
    ['Union type (TS)', '<code>string | number</code> — puede ser uno u otro.'],
    ['Unknown (TS)', 'Como <code>any</code> pero seguro: obliga a narrowing antes de usar.'],

    // V
    ['Vite', 'Build tool moderno. Dev server ultra rápido.'],
    ['Virtual DOM', 'Representación ligera del DOM en memoria. React compara vs el real y aplica cambios mínimos.'],
    ['Viewport', 'Área visible del navegador. <code>meta viewport</code> es crítico para responsive.'],

    // W
    ['WCAG', 'Web Content Accessibility Guidelines. Estándar oficial. Nivel AA es el target.'],
    ['Web Vitals', 'Métricas de Google para UX real. LCP, INP, CLS.'],
    ['Webpack', 'Bundler legacy. Potente pero lento. Hoy muchos migran a Vite.'],
    ['Whitespace collapse', 'HTML colapsa múltiples espacios/saltos en uno solo.'],

    // X
    ['XHR (XMLHttpRequest)', 'API vieja para requests HTTP. Reemplazada por fetch.'],
    ['XSS', 'Cross-Site Scripting. Ataque por inyección. Defensa: <code>textContent</code> en vez de <code>innerHTML</code>.'],

    // Z
    ['Z-index', 'Orden en el eje Z (apilamiento). Solo funciona en elementos posicionados.'],
    ['Zustand', 'Librería de state management minimalista.'],
  ];

  // ═════════════════════════════════════════════════════
  // Render
  // ═════════════════════════════════════════════════════
  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  function getInitial(name) {
    return name[0].toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function buildLetterNav(termsByLetter) {
    const nav = document.getElementById('letterNav');
    nav.innerHTML = ALPHABET.map(l => {
      const has = termsByLetter[l] && termsByLetter[l].length > 0;
      return `<a href="#letter-${l}" class="${has ? 'has-content' : 'empty'}">${l}</a>`;
    }).join('');
  }

  function groupByLetter(terms) {
    const grouped = {};
    for (const [name, def] of terms) {
      const l = getInitial(name);
      (grouped[l] ??= []).push([name, def]);
    }
    return grouped;
  }

  function renderTerms(grouped) {
    const root = document.getElementById('content');
    root.innerHTML = ALPHABET
      .filter(l => grouped[l])
      .map(letter => {
        const terms = grouped[letter];
        return `
          <section class="letter-section" id="letter-${letter}">
            <h2 class="letter-heading">
              ${letter}
              <span class="letter-heading-count">${terms.length} término${terms.length !== 1 ? 's' : ''}</span>
            </h2>
            ${terms.map(([n, d]) => `
              <div class="term" data-name="${n.toLowerCase()}" data-def="${stripHtml(d).toLowerCase()}">
                <div class="term-name">${escape(n)}</div>
                <div class="term-def">${d}</div>
              </div>
            `).join('')}
          </section>
        `;
      })
      .join('');
  }

  function stripHtml(s) {
    return s.replace(/<[^>]*>/g, '');
  }
  function escape(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ═════════════════════════════════════════════════════
  // Búsqueda
  // ═════════════════════════════════════════════════════
  let allTerms = document.querySelectorAll('.term');
  let allSections = document.querySelectorAll('.letter-section');

  function search(query) {
    const q = query.trim().toLowerCase();
    const clearBtn = document.getElementById('clearBtn');
    clearBtn.style.display = q ? 'inline-block' : 'none';

    if (!q) {
      allTerms.forEach(t => t.classList.remove('hidden'));
      allSections.forEach(s => s.style.display = '');
      // Quitar marcas
      document.querySelectorAll('.term mark').forEach(m => {
        const text = m.textContent;
        m.replaceWith(text);
      });
      updateCount(TERMS.length);
      document.getElementById('emptyState').style.display = 'none';
      return;
    }

    let visibleCount = 0;
    allTerms.forEach(t => {
      const name = t.dataset.name;
      const def = t.dataset.def;
      const match = name.includes(q) || def.includes(q);
      t.classList.toggle('hidden', !match);
      if (match) visibleCount++;
    });

    // Ocultar secciones sin matches
    allSections.forEach(section => {
      const visibles = section.querySelectorAll('.term:not(.hidden)');
      section.style.display = visibles.length === 0 ? 'none' : '';
    });

    // Highlight matches
    document.querySelectorAll('.term:not(.hidden)').forEach(t => {
      const name = t.querySelector('.term-name');
      const def = t.querySelector('.term-def');
      // Reset HTML
      const origName = TERMS.find(([n]) => n.toLowerCase() === t.dataset.name)?.[0];
      const origDef  = TERMS.find(([n]) => n.toLowerCase() === t.dataset.name)?.[1];
      if (!origName) return;
      name.innerHTML = highlight(escape(origName), q);
      def.innerHTML  = highlightHtml(origDef, q);
    });

    updateCount(visibleCount);
    document.getElementById('emptyState').style.display = visibleCount === 0 ? 'block' : 'none';
  }

  function highlight(text, q) {
    if (!q) return text;
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return text.replace(re, '<mark>$1</mark>');
  }
  function highlightHtml(html, q) {
    // Solo highlight en text nodes, no en HTML
    if (!q) return html;
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    // Reemplazo simple — funciona porque las definiciones tienen HTML controlado por nosotros
    return html.replace(/(>)([^<]+)(<|$)/g, (_, before, text, after) => {
      return before + text.replace(re, '<mark>$1</mark>') + after;
    });
  }

  function updateCount(n) {
    const el = document.getElementById('resultsCount');
    el.textContent = n === TERMS.length
      ? `${TERMS.length} términos`
      : `${n} de ${TERMS.length} términos`;
  }

  // ═════════════════════════════════════════════════════
  // Init
  // ═════════════════════════════════════════════════════
  const grouped = groupByLetter(TERMS);
  renderTerms(grouped);
  buildLetterNav(grouped);
  allTerms = document.querySelectorAll('.term');
  allSections = document.querySelectorAll('.letter-section');
  updateCount(TERMS.length);

  const searchInput = document.getElementById('search');
  searchInput.addEventListener('input', (e) => search(e.target.value));
  document.getElementById('clearBtn').addEventListener('click', () => {
    searchInput.value = '';
    search('');
    searchInput.focus();
  });

  // Atajo "/"
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
    if (e.key === 'Escape' && document.activeElement === searchInput) {
      searchInput.value = ''; search(''); searchInput.blur();
    }
  });
  </script>
</body>
</html>
