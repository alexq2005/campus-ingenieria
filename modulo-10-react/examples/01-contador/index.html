<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React — Contador (via CDN)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 3rem auto; padding: 1rem; background: #f1f5f9; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.08); text-align: center; }
    h1 { margin-top: 0; color: #0f172a; }
    .n { font-size: 4rem; font-weight: bold; color: #0ea5e9; margin: 1rem 0; }
    button { background: #0ea5e9; color: white; border: 0; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; margin: 0 0.2rem; }
    button:hover { background: #0284c7; }
    button.reset { background: #64748b; }
    .nota { font-size: 0.85em; color: #64748b; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React via CDN (solo didáctico — en producción usás Vite con npm) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    function Contador() {
      const [n, setN] = useState(0);

      return (
        <div className="card">
          <h1>Contador React</h1>
          <div className="n">{n}</div>
          <div>
            <button onClick={() => setN(n - 1)}>−1</button>
            <button onClick={() => setN(prev => prev + 1)}>+1</button>
            <button className="reset" onClick={() => setN(0)}>Reset</button>
          </div>
          <p className="nota">
            Cada click reejecuta la función Contador. React compara el virtual DOM
            y solo actualiza el &lt;div class="n"&gt; en el DOM real.
          </p>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Contador />);
  </script>
</body>
</html>
