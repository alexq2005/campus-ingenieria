<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicios PS10 — CS-FE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #1e293b; --surface-2: #283649; --code-bg: #0f172a;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #a78bfa; --gold: #fbbf24; --green: #34d399; --pink: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      color: var(--muted); font-size: 0.9em;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .topbar a:hover { color: var(--accent); border-color: var(--accent); }
    .topbar .right { display: flex; gap: 0.5rem; }

    .meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.82em; color: var(--muted);
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .render h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem; line-height: 1.2;
    }
    .render h2 {
      font-size: 1.6rem; color: var(--gold);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .render h3 { font-size: 1.25rem; color: var(--accent); margin: 1.7rem 0 0.7rem; }
    .render h4 { font-size: 1.05rem; color: var(--pink); margin: 1.2rem 0 0.5rem; }
    .render p { margin-bottom: 1rem; }
    .render ul, .render ol { margin: 0.6rem 0 1.2rem 1.6rem; }
    .render li { margin-bottom: 0.35rem; }
    .render hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .render strong { color: var(--text); font-weight: 700; }
    .render em { color: var(--gold); font-style: italic; }
    .render blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem; margin: 1rem 0;
      color: var(--muted); font-style: italic;
      background: rgba(56, 189, 248, 0.04);
    }
    .render code {
      background: var(--surface-2); color: var(--gold);
      padding: 1px 6px; border-radius: 3px;
      font-size: 0.9em;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .render pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
      overflow-x: auto; margin: 1rem 0; position: relative;
    }
    .render pre code {
      background: none; color: var(--text); padding: 0;
      font-size: 0.85em; line-height: 1.65;
    }
    .render table {
      width: 100%; border-collapse: collapse;
      margin: 1rem 0; font-size: 0.92em;
    }
    .render th, .render td {
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); text-align: left;
    }
    .render th {
      background: var(--surface-2); color: var(--accent);
      font-weight: 600;
    }
    .render tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .render details {
      background: var(--surface);
      border-left: 3px solid var(--gold);
      padding: 0.8rem 1rem;
      margin: 0.8rem 0;
      border-radius: 5px;
    }
    .render details[open] { padding-bottom: 1rem; }
    .render details summary {
      cursor: pointer; color: var(--gold); font-weight: 600;
    }
    .render details summary:hover { color: var(--text); }

    .render iframe {
      max-width: 100%; border-radius: 10px;
      border: 1px solid var(--border); margin: 1rem 0;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 4px;
      font-size: 0.75em; cursor: pointer;
      opacity: 0; transition: all 0.15s;
      font-family: inherit;
    }
    .render pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="../index.html">← Portal</a>
      <div class="right">
        <a href="../lectures.html#m10">📚 Ver en viewer integrado</a>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <article class="render" id="content"></article>
  </div>

  <script id="md-content" type="application/json">"# Problem Set 10 — React\n\n## Sección A — Componentes y props\n\n1. Construí un componente `<Boton variante=\"primary|danger|ghost\" size=\"sm|md|lg\" onClick icon?>`. Probá reutilizarlo 6 veces con distintas props.\n\n2. Componente `<Rating value={3.5} max={5} />` que muestre estrellas llenas/medias/vacías. No es input — solo display.\n\n3. Componente `<Avatar src? name iniciales? size />`: si hay `src` muestra imagen; si no, muestra iniciales sobre fondo de color único basado en el nombre.\n\n## Sección B — useState\n\n4. **Contador con historial**: además de `+1` / `-1`, mantené un array con todos los valores que pasó el contador. Mostralos como tags.\n\n5. **Temperatura**: dos inputs (Celsius y Fahrenheit). Cambiar uno actualiza el otro. (Patrón: **lifting state up**.)\n\n6. **Formulario de registro**: 4 campos con validación. Mostrar errores debajo de cada campo. Deshabilitar el botón si hay errores.\n\n## Sección C — useEffect\n\n7. **Hora en vivo**: mostrá la hora actualizada cada segundo. Cleanup del interval correctamente.\n\n8. **Event listener global**: detectá cuando se presiona `Escape` y ejecutá una acción. Cleanup necesario.\n\n9. **Fetch de GitHub user**: input de username + fetch a `api.github.com/users/{user}`. Mostrá avatar, bio, followers. Loading y error states.\n\n## Sección D — Custom hooks\n\n10. Implementá `useToggle(initial)` que devuelva `[value, toggle, setTrue, setFalse]`.\n\n11. Implementá `useDebounce(value, ms)` que devuelva el valor debounced. Usalo en un input de búsqueda.\n\n12. Implementá `useOnlineStatus()` que devuelva `true/false` según `navigator.onLine` y los eventos `online`/`offline`.\n\n13. Implementá `useMediaQuery(query)` que reaccione a breakpoints (`useMediaQuery('(min-width: 768px)')`).\n\n## Sección E — React Router\n\n14. App con 4 rutas: `/`, `/about`, `/productos`, `/productos/:id`. NavBar con `<Link>`s. La ruta `/productos/:id` muestra el ID.\n\n15. **Protected route**: una ruta `/admin` solo accesible si `isAuth === true`. Si no, redirigir a `/login`.\n\n## Sección F — Apps medianas\n\n16. **Buscador de películas** (OMDb, TMDB o similar): input con debounce → listado de resultados → click en una card → detalle. Paginación.\n\n17. **Pokédex**: listado paginado de pokémon (PokéAPI). Filtro por tipo. Detalle con stats, evoluciones, movimientos.\n\n18. **Gestor de notas**: CRUD completo con React Router (`/notas`, `/notas/nueva`, `/notas/:id`, `/notas/:id/editar`). Persistencia en localStorage.\n\n## Sección G — Estado global\n\n19. Migrá la lista de productos/carrito del módulo 7 a React con **Context API**. `CarritoProvider` envuelve la app; componentes acceden vía `useCarrito()` custom hook.\n\n20. Reimplementá el mismo carrito con **Zustand**. Comparalo con Context — ¿cuál es menos boilerplate?\n\n## Desafío\n\n21. **Trello-lite**: Kanban con 3 columnas (TODO, Doing, Done). Drag & drop entre columnas. Persistencia.\n\n22. **Chat en vivo** con WebSocket (podés usar un server público de testing, ej `wss://echo.websocket.org`): enviar mensajes y recibir los echos. Scroll automático al último mensaje.\n\n## Entregable\n\nCrear proyecto Vite + React (`npm create vite@latest ... --template react`). Implementar al menos 3 de los ejercicios medianos (E/F/G). Deploy a Vercel.\n"</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script>
    const md = JSON.parse(document.getElementById('md-content').textContent);
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;

    // Reading time + word count
    const words = md.trim().split(/\s+/).length;
    const minutes = Math.max(1, Math.round(words / 200));
    document.getElementById('meta').innerHTML =
      `<span>⏱ ${minutes} min de lectura</span><span>📝 ${words.toLocaleString('es')} palabras</span>`;

    // Copy buttons en pre
    document.querySelectorAll('.render pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.onclick = async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ copiado';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('copied'); }, 1500);
        } catch { btn.textContent = '✗ error'; }
      };
      pre.appendChild(btn);
    });

    // IDs en headings para anchor links
    document.querySelectorAll('.render h2, .render h3, .render h4').forEach(h => {
      const id = h.textContent.toLowerCase()
        .replace(/[^\w\sáéíóúñü-]/g, '')
        .replace(/\s+/g, '-').slice(0, 60);
      h.id = id;
    });
  </script>
</body>
</html>
