<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Propagación de eventos — capture, target, bubble</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 720px; margin: 0 auto; }
    .outer { padding: 2rem; background: #dbeafe; border: 2px solid #3b82f6; border-radius: 12px; cursor: pointer; }
    .middle { padding: 2rem; background: #bfdbfe; border: 2px solid #2563eb; border-radius: 10px; cursor: pointer; }
    .inner { padding: 2rem; background: #93c5fd; border: 2px solid #1d4ed8; border-radius: 8px; cursor: pointer; text-align: center; font-weight: 600; }

    #log { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 6px; font-family: monospace; font-size: 0.9em; min-height: 200px; max-height: 300px; overflow: auto; margin-top: 1.5rem; }
    #log div { padding: 0.2rem 0; border-bottom: 1px solid #1e293b; }
    .capture { color: #fbbf24; }
    .target  { color: #f87171; }
    .bubble  { color: #34d399; }

    button { background: #ef4444; color: white; border: 0; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Propagación de eventos</h1>
  <p>Cliqueá sobre los cuadros y mirá el orden: primero <strong>CAPTURE</strong> (de afuera hacia adentro), luego <strong>TARGET</strong>, luego <strong>BUBBLE</strong> (de adentro hacia afuera).</p>

  <div class="outer">
    outer
    <div class="middle">
      middle
      <div class="inner">INNER — cliqueame</div>
    </div>
  </div>

  <p style="margin-top:1rem;"><button onclick="log.innerHTML=''">Limpiar log</button></p>

  <div id="log"></div>

  <script>
    const log = document.getElementById('log');
    function escribir(fase, elemento) {
      const div = document.createElement('div');
      div.classList.add(fase);
      div.textContent = `${fase.toUpperCase().padEnd(8)} ${elemento}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    const outer = document.querySelector('.outer');
    const middle = document.querySelector('.middle');
    const inner = document.querySelector('.inner');

    // Phase: CAPTURE (tercer arg = true)
    outer.addEventListener('click', (e) => escribir('capture', 'outer'), true);
    middle.addEventListener('click', (e) => escribir('capture', 'middle'), true);
    inner.addEventListener('click', (e) => {
      escribir('target', 'inner (es el target)');
    }, true);

    // Phase: BUBBLE (default)
    inner.addEventListener('click', (e) => escribir('bubble', 'inner'));
    middle.addEventListener('click', (e) => escribir('bubble', 'middle'));
    outer.addEventListener('click', (e) => escribir('bubble', 'outer'));

    // document nivel raíz
    document.addEventListener('click', (e) => escribir('bubble', 'document'));
  </script>
</body>
</html>
