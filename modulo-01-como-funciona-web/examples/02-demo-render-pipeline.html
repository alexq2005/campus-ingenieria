<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Demo — Render pipeline: Layout vs Paint vs Composite</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; background: #0f172a; color: #e2e8f0; }
    h1 { margin-top: 0; }
    .box {
      width: 120px; height: 120px;
      background: #38bdf8;
      display: inline-block;
      margin: 1rem;
      border-radius: 8px;
      transition: all 0.4s ease;
    }
    button {
      background: #38bdf8; color: #0f172a; border: 0;
      padding: 0.6rem 1rem; margin: 0.25rem;
      border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    code { background: #1e293b; padding: 0.1rem 0.4rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Render pipeline en vivo</h1>
  <p>Abrí DevTools → pestaña <strong>Performance</strong> → click "Record" → cliqueá cada botón → "Stop".</p>
  <p>Observá cuáles disparan <strong>Layout</strong> (reflow) y cuáles solo <strong>Composite</strong>.</p>

  <div class="box" id="caja"></div>

  <div>
    <button onclick="cambiarWidth()">Cambiar <code>width</code> (Layout + Paint + Composite) 🐢</button>
    <button onclick="cambiarBackground()">Cambiar <code>background</code> (Paint + Composite) 🟡</button>
    <button onclick="cambiarTransform()">Cambiar <code>transform</code> (solo Composite) 🚀</button>
  </div>

  <p><strong>Regla práctica:</strong> animá con <code>transform</code> y <code>opacity</code>. Evitá animar <code>width</code>, <code>height</code>, <code>top</code>, <code>left</code>.</p>

  <script>
    const caja = document.getElementById('caja');
    let w = 120;
    let tx = 0;

    function cambiarWidth() {
      w = w === 120 ? 240 : 120;
      caja.style.width = w + 'px';
    }
    function cambiarBackground() {
      caja.style.background = caja.style.background === 'rgb(244, 114, 182)' ? '#38bdf8' : '#f472b6';
    }
    function cambiarTransform() {
      tx = tx === 0 ? 200 : 0;
      caja.style.transform = `translateX(${tx}px)`;
    }
  </script>
</body>
</html>
